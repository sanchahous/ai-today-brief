<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!-- X / Bluesky / Mastodon banner (1500x500, 3:1).
       All content inside the central ~1200x380 safe area: X crops edges on
       mobile and the avatar overlaps the bottom-left corner. -->
  <rect width="1500" height="500" fill="#0f1115"/>
  <circle cx="1390" cy="-40" r="220" fill="#f0c040" opacity="0.07"/>
