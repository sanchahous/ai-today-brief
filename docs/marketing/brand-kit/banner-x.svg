  <text x="750" y="295" text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="30" fill="#9aa1ad">Daily AI &amp; engineering brief for developers — signal, not noise</text>
  <text x="750" y="360" text-anchor="middle"
