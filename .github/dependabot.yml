version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Weekly (was daily) — a daily cadence opened up to 5 PRs/day, and each one
      # fires e2e + sonar (heavy jobs), so it was the dominant CI-minute cost.
      # Weekly batches them; grouping (below) still collapses patch/minor into one PR.
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # eslint-config-next 16 is not yet compatible with ESLint 10 (eslint-plugin-react crash).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 breaks `npm ci`: typescript-eslint 8.x (and eslint-config-next 16)
      # peer-require typescript ">=4.8.4 <6.1.0". A TS-7 bump ERESOLVEs on every fresh
      # install (Vercel build + Daily Pipeline). Unpin only once the linter supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    # Mirror the npm grouping: collapse action bumps into one PR per tier so a busy
    # week fires a single e2e+sonar pair instead of one per action.
    groups:
      actions-patch-minor:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
