name: Visual compiler unseen holdout A-B evaluation

on:
  push:
    branches:
      - experiment/visual-compiler-unseen-holdout-20260812
    paths:
      - scripts/visual-compiler-holdout-audit-claims.ts
      - scripts/visual-compiler-holdout-evaluate-source-ab.ts
      - .github/workflows/visual-compiler-holdout-evaluate-ab.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Source-grounded evaluation of 12 blinded cards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download rendered A-B package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31592986047
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-holdout-ab
          --dir artifacts/visual-compiler-holdout-ab

      - name: Download finalized holdout claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31592594996
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-holdout-finalized
          --dir artifacts/visual-compiler-holdout

      - name: Typecheck repository
        run: npm run typecheck

      - name: Audit extracted VisualClaims against source stories
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_HOLDOUT_CLAIM_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_HOLDOUT_AB_OUT_DIR: artifacts/visual-compiler-holdout-ab
          VISUAL_HOLDOUT_SELECTION: artifacts/visual-compiler-holdout/render-selection.json
        run: npx tsx scripts/visual-compiler-holdout-audit-claims.ts

      - name: Run source-grounded blinded visual evaluation
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_HOLDOUT_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_HOLDOUT_AB_OUT_DIR: artifacts/visual-compiler-holdout-ab
          VISUAL_HOLDOUT_SELECTION: artifacts/visual-compiler-holdout/render-selection.json
          VISUAL_HOLDOUT_CLAIM_AUDIT: artifacts/visual-compiler-holdout-ab/claim-fidelity.json
        run: npx tsx scripts/visual-compiler-holdout-evaluate-source-ab.ts

      - name: Upload evaluated A-B package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-holdout-ab-evaluated
          path: artifacts/visual-compiler-holdout-ab
          if-no-files-found: error
          retention-days: 14
