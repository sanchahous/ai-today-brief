name: Regenerate package-lock.json

on:
  workflow_dispatch:

jobs:
  fix-lockfile:
    name: npm install → open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Regenerate lock file
        run: |
          rm -f package-lock.json
          npm install --no-fund

      - name: Open PR with updated lock file
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: regenerate package-lock.json"
          branch: chore/regenerate-lockfile
          title: "chore: regenerate package-lock.json"
          body: "Lock file was out of sync with package.json. Regenerated via workflow."
          labels: dependencies
