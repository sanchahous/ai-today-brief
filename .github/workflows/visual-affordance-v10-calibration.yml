name: Visual affordance router v10 calibration

on:
  push:
    branches:
      - experiment/visual-affordance-router-v10-20260813
    paths:
      - .github/workflows/visual-affordance-v10-calibration.yml
      - src/lib/weekly-digest/visual-affordance-router-v10.ts
      - src/lib/weekly-digest/visual-affordance-router-v10.test.ts
      - src/lib/weekly-digest/visual-integrity-v10.ts
      - src/lib/weekly-digest/visual-integrity-v10.test.ts
      - src/lib/weekly-digest/visual-owner-calibration-v10.ts
      - scripts/visual-affordance-v10-calibration.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    name: Validate owner calibration and hard visual gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-affordance-router-v10-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run owner-grounded visual tests
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-affordance-router-v10.test.ts
          src/lib/weekly-digest/visual-integrity-v10.test.ts
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-role-router-v7.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build owner calibration package
        env:
          VISUAL_V10_OUT_DIR: artifacts/visual-affordance-v10-calibration
        run: npx tsx scripts/visual-affordance-v10-calibration.ts

      - name: Upload owner calibration package
        uses: actions/upload-artifact@v4
        with:
          name: visual-affordance-v10-calibration
          path: artifacts/visual-affordance-v10-calibration
          if-no-files-found: error
          retention-days: 30

      - name: Persist calibration report on experimental branch
        run: |
          mkdir -p experiments/visual-affordance-v10/calibration
          cp artifacts/visual-affordance-v10-calibration/owner-calibration-report.md experiments/visual-affordance-v10/calibration/
          cp artifacts/visual-affordance-v10-calibration/owner-calibration.json experiments/visual-affordance-v10/calibration/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-affordance-v10/calibration/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-affordance-v10/calibration
          if git diff --cached --quiet; then
            echo "Calibration output already persisted."
          else
            git commit -m "Record owner-grounded v10 calibration [skip ci]"
            git fetch origin experiment/visual-affordance-router-v10-20260813
            git rebase origin/experiment/visual-affordance-router-v10-20260813
            SKIP_E2E=1 git push origin HEAD:experiment/visual-affordance-router-v10-20260813
          fi
