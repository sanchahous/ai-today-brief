name: Visual affordance v10 targeted owner backtest

on:
  push:
    branches:
      - experiment/visual-affordance-router-v10-20260813
    paths:
      - .github/workflows/visual-affordance-v10-targeted.yml
      - src/lib/weekly-digest/visual-affordance-router-v10.ts
      - src/lib/weekly-digest/visual-affordance-treatment-v10.ts
      - src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts
      - src/lib/weekly-digest/visual-integrity-v10.ts
      - scripts/visual-affordance-v10-targeted-render.ts
      - scripts/visual-affordance-v10-targeted-evaluate.ts
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  targeted:
    name: Render and compare three owner-rejected V8 stories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-affordance-router-v10-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate owner-grounded contracts before paid calls
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-affordance-router-v10.test.ts
          src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts
          src/lib/weekly-digest/visual-integrity-v10.test.ts

      - name: Typecheck repository and backtest harnesses
        run: npm run typecheck

      - name: Download exact V8 v4 baseline package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31629283372
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-v8-targeted-evaluated-v4
          --dir artifacts/visual-compiler-v8-v4-baseline

      - name: Render V10 candidates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V10_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V10_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json
          VISUAL_V10_BASELINE_ROOT: artifacts/visual-compiler-v8-v4-baseline
          VISUAL_V10_OUT_DIR: artifacts/visual-affordance-v10-targeted
        run: npx tsx scripts/visual-affordance-v10-targeted-render.ts

      - name: Evaluate intent-blind pixels then headline-paired cards
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V10_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V10_OUT_DIR: artifacts/visual-affordance-v10-targeted
        run: npx tsx scripts/visual-affordance-v10-targeted-evaluate.ts

      - name: Upload complete V10 owner-review package
        uses: actions/upload-artifact@v4
        with:
          name: visual-affordance-v10-targeted-evaluated
          path: artifacts/visual-affordance-v10-targeted
          if-no-files-found: error
          retention-days: 30

      - name: Persist V10 backtest on isolated branch
        run: |
          mkdir -p experiments/visual-affordance-v10/targeted/results
          cp artifacts/visual-affordance-v10-targeted/render-report.md experiments/visual-affordance-v10/targeted/results/
          cp artifacts/visual-affordance-v10-targeted/render-manifest.json experiments/visual-affordance-v10/targeted/results/
          cp artifacts/visual-affordance-v10-targeted/blind-contact-sheet.png experiments/visual-affordance-v10/targeted/results/
          cp artifacts/visual-affordance-v10-targeted/evaluation-report.md experiments/visual-affordance-v10/targeted/results/
          cp artifacts/visual-affordance-v10-targeted/evaluation.json experiments/visual-affordance-v10/targeted/results/
          cp artifacts/visual-affordance-v10-targeted/evaluated-contact-sheet.png experiments/visual-affordance-v10/targeted/results/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-affordance-v10/targeted/results/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-affordance-v10/targeted/results
          git commit -m "Record owner-grounded V10 targeted backtest [skip ci]"
          git fetch origin experiment/visual-affordance-router-v10-20260813
          git rebase origin/experiment/visual-affordance-router-v10-20260813
          SKIP_E2E=1 git push origin HEAD:experiment/visual-affordance-router-v10-20260813
