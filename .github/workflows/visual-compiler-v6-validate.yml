name: Visual compiler v6 validation

on:
  push:
    branches:
      - experiment/visual-compiler-v6-hybrid-20260812
    paths:
      - src/lib/weekly-digest/visual-hybrid-v6.ts
      - src/lib/weekly-digest/visual-hybrid-v6.test.ts
      - scripts/visual-compiler-v6-plan-audit.ts
      - src/lib/weekly-digest/visual-generic-svg-v6.ts
      - src/lib/weekly-digest/visual-generic-svg-v6.test.ts
      - .github/workflows/visual-compiler-v6-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and typecheck hybrid v6
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run hybrid contract tests
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-hybrid-v6.test.ts
          src/lib/weekly-digest/visual-generic-svg-v5.test.ts

      - name: Typecheck repository
        run: npm run typecheck
