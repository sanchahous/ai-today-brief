name: Visual compiler v7 role-router validation

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - src/lib/weekly-digest/visual-role-router-v7.ts
      - src/lib/weekly-digest/visual-role-router-v7.test.ts
      - .github/workflows/visual-compiler-v7-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and typecheck pre-render role routing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run router and semantic regressions
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-role-router-v7.test.ts
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-generic-svg-v6.test.ts

      - name: Typecheck repository
        run: npm run typecheck
