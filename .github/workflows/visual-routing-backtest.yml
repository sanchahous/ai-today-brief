name: Visual routing backtest

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - scripts/visual-routing-backtest.ts
      - .github/workflows/visual-routing-backtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: Render and blind-evaluate visual formats
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run controlled A/B/C visual backtest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKTEST_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          BACKTEST_VISION_MODEL: 'gemini-2.5-flash'
          BACKTEST_OUT_DIR: artifacts/visual-routing-backtest
        run: npx tsx scripts/visual-routing-backtest.ts

      - name: Upload visual backtest package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-routing-backtest
          path: artifacts/visual-routing-backtest
          if-no-files-found: warn
          retention-days: 14
