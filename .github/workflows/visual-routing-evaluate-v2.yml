name: Visual routing bounded evaluation

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - scripts/visual-routing-evaluate-v2.ts
      - .github/workflows/visual-routing-evaluate-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Bounded blind retrieval and gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download original renders
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31577972670 --repo "$GITHUB_REPOSITORY" --name visual-routing-backtest --dir artifacts/visual-routing-backtest

      - name: Run bounded structured judge
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          BACKTEST_JUDGE_MODEL: google/gemini-2.5-flash
          BACKTEST_INPUT_DIR: artifacts/visual-routing-backtest
        run: npx tsx scripts/visual-routing-evaluate-v2.ts

      - name: Upload bounded evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-routing-backtest-v2
          path: artifacts/visual-routing-backtest
          if-no-files-found: error
          retention-days: 14
