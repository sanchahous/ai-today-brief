name: Auto-publish drafts

on:
  schedule:
    # 22:05 UTC = 00:05 Kyiv (EET, winter) / 01:05 Kyiv (EEST, summer) — either
    # way strictly after midnight Kyiv, so getPipelineDateKyiv() has already
    # rolled over and the [today-7, today) window covers yesterday's draft plus
    # anything accumulated over the week.
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — triage + log only, no writes/publish/Telegram"
        type: boolean
        required: false
        default: false
      date:
        description: "Override the Kyiv 'today' cutoff (YYYY-MM-DD, defaults to now)"
        required: false
        default: ""
      window_days:
        description: "How many days back to sweep for unreviewed drafts"
        required: false
        default: "7"

jobs:
  run:
    name: Auto-publish unreviewed drafts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-publish

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run auto-publish
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          if [[ -n "${{ inputs.date }}" ]]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [[ -n "${{ inputs.window_days }}" ]]; then
            ARGS="$ARGS --window-days ${{ inputs.window_days }}"
          fi
          npx tsx pipeline/scripts/auto-publish.ts $ARGS

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_REVIEW_CHAT_ID" ] && exit 0
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 15 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_REVIEW_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ <b>Auto-publish FAILED</b> — чернетка не опублікована. 🔗 ${RUN_URL}" \
            || true
