name: Visual compiler unseen holdout A-B render

on:
  push:
    branches:
      - experiment/visual-compiler-unseen-holdout-20260812
    paths:
      - scripts/visual-compiler-holdout-render-ab.ts
      - src/lib/weekly-digest/visual-generic-svg.ts
      - .github/workflows/visual-compiler-holdout-render-ab.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    name: Render 12 blinded current-versus-compiler cards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download finalized 12-story holdout selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31592594996
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-holdout-finalized
          --dir artifacts/visual-compiler-holdout

      - name: Typecheck repository
        run: npm run typecheck

      - name: Render current and compiler variants
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_HOLDOUT_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_HOLDOUT_SELECTION: artifacts/visual-compiler-holdout/render-selection.json
          VISUAL_HOLDOUT_AB_OUT_DIR: artifacts/visual-compiler-holdout-ab
        run: npx tsx scripts/visual-compiler-holdout-render-ab.ts

      - name: Upload blinded A-B package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-holdout-ab
          path: artifacts/visual-compiler-holdout-ab
          if-no-files-found: error
          retention-days: 14
