name: SonarQube

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # Scan only runs once SONAR_TOKEN is set (see step guard) — keeps CI green until Sonar is wired.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (integrity check)
        run: npm run build

      # Coverage (Vitest lcov) + sonar-report artifact join this workflow once a
      # logic layer is wired — see 00-core.mdc (Testing) and sonar-debug.mdc.
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
