name: SonarQube

on:
  # Sonar analyses TS/JS quality, so it only needs to run when code changes. Skip
  # docs/markdown/SQL-migration/workflow-only PRs (no code to scan). PR-only: the
  # post-merge push to main re-scanned an identical tree (duplicate spend).
  # NOTE: once Sonar is wired with SONAR_TOKEN, add `push: [main]` back so the main
  # branch baseline updates — until then there is nothing to scan on main.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'supabase/migrations/**'
      - '.github/**'

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # Scan only runs once SONAR_TOKEN is set (see step guard) — keeps CI green until Sonar is wired.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage (≥70% logic scope)
        run: npm run verify:coverage

      - name: Build (integrity check)
        run: npm run build

      - name: Sonar report (for agents)
        if: env.SONAR_TOKEN != ''
        run: npm run sonar:report -- --out sonar-report.md
        continue-on-error: true

      - name: Upload Sonar report artifact
        if: env.SONAR_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: sonar-report
          path: sonar-report.md
          if-no-files-found: ignore

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
