name: Visual compiler shadow evaluation v2

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - .github/workflows/visual-compiler-evaluate-shadow-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Run v2 pixel-only and headline-paired gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download v2 shadow render
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31587442489
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-shadow-v2
          --dir artifacts/visual-compiler-shadow-v2

      - name: Run bounded two-stage v2 evaluation
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_COMPILER_JUDGE_MODEL: 'google/gemini-2.5-flash'
          VISUAL_COMPILER_OUT_DIR: artifacts/visual-compiler-shadow-v2
        run: npx tsx scripts/visual-compiler-evaluate-shadow.ts

      - name: Upload evaluated v2 shadow package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-shadow-v2-evaluated
          path: artifacts/visual-compiler-shadow-v2
          if-no-files-found: error
          retention-days: 14
