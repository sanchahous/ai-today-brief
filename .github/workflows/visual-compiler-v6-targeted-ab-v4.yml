name: Visual compiler v6 targeted A-B v4

on:
  push:
    branches:
      - experiment/visual-compiler-v6-targeted-ab-20260812
    paths:
      - .github/workflows/visual-compiler-v6-targeted-ab-v4.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ab:
    name: Validate render evaluate and persist five targeted stories
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v6-targeted-ab-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild the typechecked targeted v6 harness
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          renderer = Path('src/lib/weekly-digest/visual-generic-svg-v6.ts')
          renderer_text = renderer.read_text()
          old_import = "import type { AutoVisualClaimV5 } from './visual-auto-claim-v5';"
          new_import = "import { compileAutoVisualClaimV5, type AutoVisualClaimV5 } from './visual-auto-claim-v5';"
          if old_import in renderer_text:
              renderer_text = renderer_text.replace(old_import, new_import, 1)
          elif 'compileAutoVisualClaimV5, type AutoVisualClaimV5' not in renderer_text:
              raise SystemExit('The expected v6 renderer import was not found.')

          old_plan = "  const plan: VisualPlan = { ...input.plan, overlays };"
          if old_plan in renderer_text:
              renderer_text = renderer_text.replace(
                  old_plan,
                  '  const plan = compileAutoVisualClaimV5(autoClaim);',
                  1,
              )
          elif 'const plan = compileAutoVisualClaimV5(autoClaim);' not in renderer_text:
              raise SystemExit('The expected v6 overlay compilation block was not found.')
          renderer.write_text(renderer_text)

          workflow = Path('.github/workflows/visual-compiler-v6-targeted-ab.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          embedded = dedent(workflow[start:end])
          invalid = "render_source = render_source.replace(/\\[v5-ab\\]/g, '[v6-targeted]') if False else render_source\n"
          if invalid not in embedded:
              raise SystemExit('The expected invalid compatibility line was not found.')
          embedded = embedded.replace(invalid, '')
          exec(compile(embedded, 'targeted-v6-harness-generator.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the complete repository and generated harness
        run: npm run typecheck

      - name: Persist validated renderer and harness before image calls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/weekly-digest/visual-generic-svg-v6.ts \
            scripts/visual-compiler-v6-render-ab.ts \
            scripts/visual-compiler-v6-evaluate-ab.ts
          if git diff --cached --quiet; then
            echo "Validated renderer and harness already persisted."
          else
            git commit -m "Compile v6 overlays and add targeted A-B harness"
            git fetch origin experiment/visual-compiler-v6-targeted-ab-20260812
            git rebase origin/experiment/visual-compiler-v6-targeted-ab-20260812
            SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v6-targeted-ab-20260812
          fi

      - name: Download source-audited v6 treatment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31608889038
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-v6-hybrid-treatments
          --dir artifacts/visual-compiler-v6-hybrid

      - name: Render exact current and hybrid v6 treatments
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V6_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V6_TREATMENTS: artifacts/visual-compiler-v6-hybrid/v6-treatments.json
          VISUAL_V6_AB_OUT_DIR: artifacts/visual-compiler-v6-targeted-ab
        run: npx tsx scripts/visual-compiler-v6-render-ab.ts

      - name: Evaluate five targeted stories blinded
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V6_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V6_TREATMENTS: artifacts/visual-compiler-v6-hybrid/v6-treatments.json
          VISUAL_V6_AB_OUT_DIR: artifacts/visual-compiler-v6-targeted-ab
        run: npx tsx scripts/visual-compiler-v6-evaluate-ab.ts

      - name: Upload complete targeted A-B package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v6-targeted-ab-evaluated
          path: artifacts/visual-compiler-v6-targeted-ab
          if-no-files-found: warn
          retention-days: 14

      - name: Persist targeted A-B results on isolated branch
        if: success()
        run: |
          mkdir -p experiments/visual-compiler-v6/targeted-ab/results
          cp artifacts/visual-compiler-v6-targeted-ab/render-report.md experiments/visual-compiler-v6/targeted-ab/results/
          cp artifacts/visual-compiler-v6-targeted-ab/render-manifest.json experiments/visual-compiler-v6/targeted-ab/results/
          cp artifacts/visual-compiler-v6-targeted-ab/blind-contact-sheet.png experiments/visual-compiler-v6/targeted-ab/results/
          cp artifacts/visual-compiler-v6-targeted-ab/evaluation-report.md experiments/visual-compiler-v6/targeted-ab/results/
          cp artifacts/visual-compiler-v6-targeted-ab/evaluation.json experiments/visual-compiler-v6/targeted-ab/results/
          cp artifacts/visual-compiler-v6-targeted-ab/evaluated-contact-sheet.png experiments/visual-compiler-v6/targeted-ab/results/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v6/targeted-ab/results/run-id.txt
          git add experiments/visual-compiler-v6/targeted-ab/results
          git commit -m "Record targeted hybrid v6 A-B results [skip ci]"
          git fetch origin experiment/visual-compiler-v6-targeted-ab-20260812
          git rebase origin/experiment/visual-compiler-v6-targeted-ab-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v6-targeted-ab-20260812
