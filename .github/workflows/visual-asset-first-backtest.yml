name: Visual asset-first backtest

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - scripts/visual-asset-first-backtest.ts
      - .github/workflows/visual-asset-first-backtest.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    name: Render clean assets and deterministic overlays
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download run-one comparison package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31577972670 --repo "$GITHUB_REPOSITORY" --name visual-routing-backtest --dir artifacts/visual-routing-backtest

      - name: Render asset-first candidates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKTEST_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          BACKTEST_ROOT: artifacts/visual-routing-backtest
        run: npx tsx scripts/visual-asset-first-backtest.ts

      - name: Upload asset-first package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-asset-first-backtest
          path: artifacts/visual-routing-backtest
          if-no-files-found: error
          retention-days: 14
