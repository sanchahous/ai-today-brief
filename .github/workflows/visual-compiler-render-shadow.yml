name: Visual compiler shadow render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render seven headline-paired visual candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile current seven-story visual plans
        run: npx tsx scripts/visual-compiler-shadow.ts

      - name: Render cinematic assets and deterministic composites
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_COMPILER_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
        run: npx tsx scripts/visual-compiler-render-shadow.ts

      - name: Upload visual compiler shadow package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-shadow-render
          path: artifacts/visual-compiler-shadow
          if-no-files-found: error
          retention-days: 14
