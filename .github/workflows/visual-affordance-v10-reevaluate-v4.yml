name: Visual affordance v10 story-aware reevaluation v4

on:
  push:
    branches:
      - experiment/visual-affordance-router-v10-20260813
    paths:
      - .github/workflows/visual-affordance-v10-reevaluate-v4.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    name: Reevaluate existing V10 v3 pixels without image generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-affordance-router-v10-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate updated critic contract
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-affordance-router-v10.test.ts
          src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts
          src/lib/weekly-digest/visual-integrity-v10.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Download exact V10 v3 render package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31686909853
          --repo "$GITHUB_REPOSITORY"
          --name visual-affordance-v10-targeted-evaluated-v3
          --dir artifacts/visual-affordance-v10-targeted-v4

      - name: Reevaluate with story-aware invariants
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V10_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V10_OUT_DIR: artifacts/visual-affordance-v10-targeted-v4
        run: npx tsx scripts/visual-affordance-v10-targeted-evaluate.ts

      - name: Upload reevaluated owner-review package
        uses: actions/upload-artifact@v4
        with:
          name: visual-affordance-v10-targeted-evaluated-v4
          path: artifacts/visual-affordance-v10-targeted-v4
          if-no-files-found: error
          retention-days: 30

      - name: Persist reevaluation
        run: |
          mkdir -p experiments/visual-affordance-v10/targeted-v4-evaluation/results
          cp artifacts/visual-affordance-v10-targeted-v4/evaluation-report.md experiments/visual-affordance-v10/targeted-v4-evaluation/results/
          cp artifacts/visual-affordance-v10-targeted-v4/evaluation.json experiments/visual-affordance-v10/targeted-v4-evaluation/results/
          cp artifacts/visual-affordance-v10-targeted-v4/evaluated-contact-sheet.png experiments/visual-affordance-v10/targeted-v4-evaluation/results/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-affordance-v10/targeted-v4-evaluation/results/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-affordance-v10/targeted-v4-evaluation/results
          git commit -m "Record story-aware V10 reevaluation [skip ci]"
          git fetch origin experiment/visual-affordance-router-v10-20260813
          git rebase origin/experiment/visual-affordance-router-v10-20260813
          SKIP_E2E=1 git push origin HEAD:experiment/visual-affordance-router-v10-20260813
