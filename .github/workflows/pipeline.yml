name: Daily Pipeline

on:
  schedule:
    # Europe/Kyiv (EEST = UTC+3). The day is split into 2-hour cycle slots
    # (pipeline/schedule.ts); we fire 6 of them, ALL DAYTIME — each lands in its
    # own cycle, so each is a distinct edition. Night slots are intentionally
    # skipped (little fresh dev content). One job per cycle: GitHub bills every job
    # rounded UP to a full minute, and 6 jobs/day is well inside the free Actions
    # minutes (the old 6 progóns × 4 slots = 24 jobs/day was the cost problem).
    # cycle/slot derive from the clock, so scheduling a subset of slots is safe.
    # In winter (EET = UTC+2) the Kyiv times shift 1 h earlier — still daytime.
    - cron: "0 5 * * *" # 08:00 Kyiv — morning
    - cron: "0 7 * * *" # 10:00 Kyiv
    - cron: "0 9 * * *" # 12:00 Kyiv — midday
    - cron: "0 11 * * *" # 14:00 Kyiv
    - cron: "0 13 * * *" # 16:00 Kyiv — afternoon
    - cron: "0 17 * * *" # 20:00 Kyiv — evening
  workflow_dispatch:
    inputs:
      attempt:
        description: "Slot 1–6 within the current progón (leave blank for auto from clock)"
        required: false
        default: "1"
      dry_run:
        description: "Dry run — print only, no DB writes"
        type: boolean
        required: false
        default: false

jobs:
  run:
    name: Run daily pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      # Zero-dependency pre-flight: if this 4 h progón already published + notified,
      # a retry slot exits here (~3 s) instead of paying ~40 s for an npm ci it won't
      # use. Fail-open (any error → skip=false → full run). Manual/dry-run dispatches
      # always proceed (guard runs on schedule only).
      - name: Skip if progón already delivered
        id: guard
        if: github.event_name == 'schedule'
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
        run: node .github/scripts/cycle-guard.mjs

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          # Card-image generation (Cloudflare Workers AI FLUX). Without these the
          # card step in run-daily.ts is skipped and items get a null card_image_url.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          # Set to 1 only after written Reddit Data API approval for this business use.
          REDDIT_DATA_API_APPROVED: ${{ vars.REDDIT_DATA_API_APPROVED }}
        run: |
          ARGS=""
          if [[ -n "${{ inputs.attempt }}" ]]; then
            ARGS="--attempt ${{ inputs.attempt }}"
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx pipeline/run-daily.ts $ARGS

      # Roll item_events up into item_metrics (the per-item reward signal). Reuses
      # this run's deps + DB creds — no separate cron/minutes. Best-effort: a
      # rollup failure must never fail the pipeline. Skipped on dry runs.
      # GEMINI_API_KEY is required because the script calls loadPipelineConfig(),
      # which mandates it even though the rollup itself never touches Gemini —
      # without it config load throws and (continue-on-error) the step no-ops,
      # leaving item_metrics empty. Mirrors every other pipeline-script step.
      - name: Refresh item metrics
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx pipeline/scripts/refresh-item-metrics.ts
