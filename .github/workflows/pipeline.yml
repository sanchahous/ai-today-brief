name: Daily Pipeline

on:
  schedule:
    # Europe/Kyiv (EEST = UTC+3). TRIMMED from 6 progóns × 4 slots (24 jobs/day) to
    # 3 progóns × 1 slot (3 jobs/day) to stay inside the free Actions minutes: GitHub
    # bills every job rounded UP to a full minute, so 24 jobs/day — even mostly skips
    # — was the dominant cost. The in-run Gemini-model queue + OpenRouter fallback
    # already retries inside a single run, so the cron retry-slots were largely
    # redundant. Result: fewer but fuller editions. cycle/slot derive from the clock
    # (pipeline/schedule.ts), so running a subset of the original windows is safe.
    - cron: '0 5 * * *'    # 08:00 Kyiv — morning
    - cron: '0 9 * * *'    # 12:00 Kyiv — midday
    - cron: '0 17 * * *'   # 20:00 Kyiv — evening
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Slot 1–6 within the current progón (leave blank for auto from clock)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry run — print only, no DB writes'
        type: boolean
        required: false
        default: false

jobs:
  run:
    name: Run daily pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Zero-dependency pre-flight: if this 4 h progón already published + notified,
      # a retry slot exits here (~3 s) instead of paying ~40 s for an npm ci it won't
      # use. Fail-open (any error → skip=false → full run). Manual/dry-run dispatches
      # always proceed (guard runs on schedule only).
      - name: Skip if progón already delivered
        id: guard
        if: github.event_name == 'schedule'
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
        run: node .github/scripts/cycle-guard.mjs

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          ARGS=""
          if [[ -n "${{ inputs.attempt }}" ]]; then
            ARGS="--attempt ${{ inputs.attempt }}"
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          npx tsx pipeline/run-daily.ts $ARGS
