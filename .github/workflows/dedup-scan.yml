name: Dedup scan

on:
  schedule:
    # 22:35 UTC = 00:35 Kyiv (EET, winter) / 01:35 Kyiv (EEST, summer) — runs
    # after auto-publish (22:05 UTC), so a pack it just published is scanned
    # the same night.
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — find + report candidate merges, write nothing"
        type: boolean
        required: false
        default: false
      backfill:
        description: "Backfill: scan the full window, not just recently-published pairs"
        type: boolean
        required: false
        default: false
      window_days:
        description: "How many days back to scan for near-duplicates"
        required: false
        default: "45"

jobs:
  run:
    name: Retroactive semantic-duplicate scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dedup-scan

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dedup scan
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          if [[ "${{ inputs.backfill }}" == "true" ]]; then
            ARGS="$ARGS --backfill"
          fi
          if [[ -n "${{ inputs.window_days }}" ]]; then
            ARGS="$ARGS --window-days ${{ inputs.window_days }}"
          fi
          npx tsx pipeline/scripts/dedup-scan.ts $ARGS

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_REVIEW_CHAT_ID" ] && exit 0
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 15 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_REVIEW_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ <b>Dedup-scan FAILED</b>. 🔗 ${RUN_URL}" \
            || true
