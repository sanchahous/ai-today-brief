name: Visual compiler v7.1 unseen routing

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-1-unseen-routing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route:
    name: Audit and route all seven unseen stories without image calls
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate semantic and fallback routing contracts
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-role-router-v7.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Extract and independently audit frozen unseen VisualClaims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_EXTRACT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_HOLDOUT_DATA: experiments/visual-compiler-v7/fresh-holdout/stories.json
          VISUAL_V5_OUT_DIR: artifacts/visual-compiler-v7-1-fresh-claims
        run: npx tsx scripts/visual-compiler-v5-extract-audit.ts

      - name: Route eligible and ineligible claims before any image calls
        env:
          VISUAL_V7_CLAIMS: artifacts/visual-compiler-v7-1-fresh-claims/v5-claims.json
          VISUAL_V7_OUT_DIR: artifacts/visual-compiler-v7-1-fresh
        run: npx tsx scripts/visual-compiler-v7-route-claims.ts

      - name: Persist frozen unseen routing package
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/output-v7-1
          cp artifacts/visual-compiler-v7-1-fresh-claims/v5-claims.json experiments/visual-compiler-v7/fresh-holdout/output-v7-1/
          cp artifacts/visual-compiler-v7-1-fresh-claims/v5-claim-report.md experiments/visual-compiler-v7/fresh-holdout/output-v7-1/
          cp artifacts/visual-compiler-v7-1-fresh-claims/v5-usage.json experiments/visual-compiler-v7/fresh-holdout/output-v7-1/
          cp artifacts/visual-compiler-v7-1-fresh/v7-routed-claims.json experiments/visual-compiler-v7/fresh-holdout/output-v7-1/
          cp artifacts/visual-compiler-v7-1-fresh/v7-routing-report.md experiments/visual-compiler-v7/fresh-holdout/output-v7-1/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/output-v7-1/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v7/fresh-holdout/output-v7-1
          git commit -m "Record frozen unseen v7.1 routing results [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

      - name: Upload complete routing package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-1-unseen-routing
          path: |
            artifacts/visual-compiler-v7-1-fresh-claims
            artifacts/visual-compiler-v7-1-fresh
          if-no-files-found: error
          retention-days: 14
