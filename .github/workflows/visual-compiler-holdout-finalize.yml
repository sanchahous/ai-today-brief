name: Visual compiler unseen holdout finalization

on:
  push:
    branches:
      - experiment/visual-compiler-unseen-holdout-20260812
    paths:
      - src/lib/weekly-digest/visual-generic-svg.ts
      - src/lib/weekly-digest/visual-generic-svg.test.ts
      - scripts/visual-compiler-holdout-finalize.ts
      - .github/workflows/visual-compiler-holdout-finalize.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    name: Normalize, compile and select unseen holdout stories
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download successful raw extraction batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31591870194
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-holdout-extraction
          --dir artifacts/visual-compiler-holdout

      - name: Run compiler and generic renderer tests
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-compiler.test.ts
          src/lib/weekly-digest/visual-auto-claim.test.ts
          src/lib/weekly-digest/visual-generic-svg.test.ts
          src/lib/weekly-digest/visual-render-policy.test.ts
          src/lib/weekly-digest/visual-gate-policy.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Finalize 21 claims and select 12-story render holdout
        env:
          VISUAL_HOLDOUT_RAW_BATCHES: artifacts/visual-compiler-holdout/partial-batches.json
          VISUAL_HOLDOUT_OUT_DIR: artifacts/visual-compiler-holdout
        run: npx tsx scripts/visual-compiler-holdout-finalize.ts

      - name: Upload finalized holdout package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-holdout-finalized
          path: artifacts/visual-compiler-holdout
          if-no-files-found: error
          retention-days: 14
