name: Visual compiler shadow evaluation

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - scripts/visual-compiler-evaluate-shadow.ts
      - .github/workflows/visual-compiler-evaluate-shadow.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Run pixel-only and headline-paired gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download seven-story shadow render
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31586491707
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-shadow-render
          --dir artifacts/visual-compiler-shadow

      - name: Run bounded two-stage visual evaluation
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_COMPILER_JUDGE_MODEL: 'google/gemini-2.5-flash'
        run: npx tsx scripts/visual-compiler-evaluate-shadow.ts

      - name: Upload evaluated shadow package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-shadow-evaluated
          path: artifacts/visual-compiler-shadow
          if-no-files-found: error
          retention-days: 14
