name: Visual compiler v7 unseen routed A-B

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-fresh-ab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ab:
    name: Render exact current and routed v7 then evaluate blinded
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build v7 render and evaluation harnesses from validated v5 harnesses
        run: |
          cp scripts/visual-compiler-v5-render-ab.ts scripts/visual-compiler-v7-render-ab.ts
          cp scripts/visual-compiler-v5-evaluate-ab.ts scripts/visual-compiler-v7-evaluate-ab.ts
          python - <<'PY'
          from pathlib import Path

          render = Path('scripts/visual-compiler-v7-render-ab.ts')
          text = render.read_text()
          text = text.replace(
              "import { renderGenericVisualSvgV5 } from '../src/lib/weekly-digest/visual-generic-svg-v5';",
              "import { renderGenericVisualSvgV5 } from '../src/lib/weekly-digest/visual-generic-svg-v5';\nimport type { VisualPipelineV7 } from '../src/lib/weekly-digest/visual-role-router-v7';",
              1,
          )
          text = text.replace('VISUAL_V5_CLAIMS', 'VISUAL_V7_ROUTED_CLAIMS')
          text = text.replace(
              "'experiments/visual-compiler-v5/fresh-holdout/output/v5-claims.json'",
              "'experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json'",
          )
          text = text.replace('VISUAL_V5_AB_OUT_DIR', 'VISUAL_V7_AB_OUT_DIR')
          text = text.replace(
              "'artifacts/visual-compiler-v5-fresh-ab'",
              "'artifacts/visual-compiler-v7-fresh-ab'",
          )
          text = text.replace('interface V5ClaimRecord {', 'interface V7ClaimRecord {', 1)
          record_tail = "  repaired: boolean;\n  eligible: boolean;\n}"
          router_tail = """  repaired: boolean;
          eligible: boolean;
          router: {
            storyId: string;
            role: AutoVisualClaimV5['semantics']['explanatoryRole'];
            pipeline: VisualPipelineV7;
            reason: string;
            expectedImageCalls: 0 | 1;
            requiredGuards: string[];
          };
          }"""
          if record_tail not in text:
              raise SystemExit('V7 record tail was not found in render harness.')
          text = text.replace(record_tail, router_tail, 1)
          text = text.replace('record: V5ClaimRecord', 'record: V7ClaimRecord')
          text = text.replace('as V5ClaimRecord[]', 'as V7ClaimRecord[]')
          row_mode = "  format: VisualPlan['format'];\n  renderMode: VisualRenderModeV5;\n  claimEligible: boolean;"
          if row_mode not in text:
              raise SystemExit('RenderRow mode block was not found.')
          text = text.replace(
              row_mode,
              "  format: VisualPlan['format'];\n  renderMode: VisualPipelineV7;\n  claimEligible: boolean;",
              1,
          )
          signature = "async function renderCompiler(record: V7ClaimRecord): Promise<{"
          if signature not in text:
              raise SystemExit('renderCompiler signature was not found.')
          text = text.replace(
              signature,
              "async function renderCompiler(record: V7ClaimRecord, currentBytes: Buffer): Promise<{",
              1,
          )
          started = "  const started = Date.now();\n  if (!record.eligible) {"
          replacement = """  const started = Date.now();
          if (record.router.pipeline === 'current_art_director') {
            return {
              pixels: currentBytes,
              final: currentBytes,
              audit: {
                provider: 'reuse',
                model: 'current-art-director-v7',
                imageCalls: 0,
                estimatedImageCostUsd: 0,
                durationMs: Date.now() - started,
                assetPaths: [],
              },
            };
          }
          if (record.router.pipeline === 'source_led_fallback' || !record.eligible) {"""
          if started not in text:
              raise SystemExit('renderCompiler start block was not found.')
          text = text.replace(started, replacement, 1)
          mode_line = "  const mode = record.renderMode || selectVisualRenderModeV5(record.autoClaim);"
          mode_replacement = """  if (record.router.pipeline !== 'deterministic_compiler') {
            throw new Error(`Unsupported v7 route ${record.router.pipeline} for ${record.story.title}.`);
          }
          const mode: VisualRenderModeV5 = 'deterministic_literal';"""
          if mode_line not in text:
              raise SystemExit('Compiler mode line was not found.')
          text = text.replace(mode_line, mode_replacement, 1)
          text = text.replace(
              'const compiler = await renderCompiler(record);',
              'const compiler = await renderCompiler(record, current.bytes);',
              1,
          )
          text = text.replace(
              'renderMode: record.renderMode,',
              'renderMode: record.router.pipeline,',
              1,
          )
          text = text.replace('`v5-current:${record.story.revision_item_id}`', '`v7-current:${record.story.revision_item_id}`')
          text = text.replace('`v5-blind:${record.story.revision_item_id}`', '`v7-blind:${record.story.revision_item_id}`')
          text = text.replace('[v5-ab]', '[v7-ab]')
          text = text.replace('# Visual Compiler v5 fresh A/B render', '# Visual Compiler v7 unseen routed A/B render')
          text = text.replace('| Mapping | Mode |', '| Mapping | Route |')
          text = text.replace('Compiler time', 'V7 time')
          compiler_calls = "  const compilerCalls = rows.reduce((sum, row) => sum + row.compiler.imageCalls, 0);"
          if compiler_calls not in text:
              raise SystemExit('Compiler call summary was not found.')
          text = text.replace(
              compiler_calls,
              compiler_calls + "\n  const v7ExpectedCalls = rows.reduce(\n    (sum, row) => sum + (row.renderMode === 'current_art_director' ? 1 : 0),\n    0,\n  );",
              1,
          )
          old_summary = "    `Compiler: ${compilerCalls} image calls, estimated $${compilerCost.toFixed(3)}, measured ${(compilerMs / 1000).toFixed(1)}s serialized wall time.`,"
          new_summary = "    `V7 selected route: ${v7ExpectedCalls} expected production image call(s); ${compilerCalls} additional experiment call(s), estimated $${compilerCost.toFixed(3)}, measured ${(compilerMs / 1000).toFixed(1)}s local/reuse time.`,"
          if old_summary not in text:
              raise SystemExit('Compiler report summary was not found.')
          text = text.replace(old_summary, new_summary, 1)
          render.write_text(text)

          evaluate = Path('scripts/visual-compiler-v7-evaluate-ab.ts')
          text = evaluate.read_text()
          text = text.replace('VISUAL_V5_AB_OUT_DIR', 'VISUAL_V7_AB_OUT_DIR')
          text = text.replace("'artifacts/visual-compiler-v5-fresh-ab'", "'artifacts/visual-compiler-v7-fresh-ab'")
          text = text.replace('VISUAL_V5_CLAIMS', 'VISUAL_V7_ROUTED_CLAIMS')
          text = text.replace(
              "'experiments/visual-compiler-v5/fresh-holdout/output/v5-claims.json'",
              "'experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json'",
          )
          claim_tail = "  repaired: boolean;\n  eligible: boolean;\n}"
          claim_router_tail = """  repaired: boolean;
          eligible: boolean;
          router: {
            pipeline: 'current_art_director' | 'deterministic_compiler' | 'source_led_fallback';
            expectedImageCalls: 0 | 1;
            reason: string;
          };
          }"""
          if claim_tail not in text:
              raise SystemExit('Evaluator claim tail was not found.')
          text = text.replace(claim_tail, claim_router_tail, 1)
          source_eval_field = "  productionPass: boolean;\n  weightedScore: number;"
          if source_eval_field not in text:
              raise SystemExit('SourceEvaluation fields were not found.')
          text = text.replace(
              source_eval_field,
              "  safePass: boolean;\n  productionPass: boolean;\n  weightedScore: number;",
              1,
          )
          old_function_start = text.index('function sourceEvaluation(')
          old_function_end = text.index('\n\nfunction mark', old_function_start)
          new_function = r'''function sourceEvaluation(
            source: Source,
            pixel: PixelVerdict,
            card: CardVerdict,
            claimEligible: boolean,
            pipeline: string,
          ): SourceEvaluation {
            const visual = visualPass(pixel, card);
            const safe =
              !pixel.contradictionVisible &&
              !pixel.unsupportedSpecificsVisible &&
              !pixel.generatedTextPresent &&
              pixel.subjectConsistent &&
              card.centralClaimGrounded &&
              card.certaintyPreserved &&
              card.labelsExact &&
              card.thumbnailReadable &&
              !card.misleading;
            const production =
              source === 'current'
                ? visual
                : pipeline === 'source_led_fallback'
                  ? safe
                  : visual && claimEligible;
            return {
              pixel,
              card,
              pixelPass: pixelPass(pixel),
              visualPass: visual,
              safePass: safe,
              productionPass: production,
              weightedScore: weightedVisualScore(scores(card)),
            };
          }'''
          text = text[:old_function_start] + new_function + text[old_function_end:]
          text = text.replace(
              "key: 'pixelPass' | 'visualPass' | 'productionPass'",
              "key: 'pixelPass' | 'visualPass' | 'safePass' | 'productionPass'",
              1,
          )
          old_calls = """      current: sourceEvaluation('current', pixelBySource.current, cardBySource.current, claim.eligible),
                compiler: sourceEvaluation('compiler', pixelBySource.compiler, cardBySource.compiler, claim.eligible),"""
          new_calls = """      current: sourceEvaluation(
                'current',
                pixelBySource.current,
                cardBySource.current,
                claim.eligible,
                'current_art_director',
              ),
              compiler: sourceEvaluation(
                'compiler',
                pixelBySource.compiler,
                cardBySource.compiler,
                claim.eligible,
                claim.router.pipeline,
              ),"""
          if old_calls not in text:
              raise SystemExit('Evaluator sourceEvaluation calls were not found.')
          text = text.replace(old_calls, new_calls, 1)
          text = text.replace(
              "'The headline supplies named identity. The image should add one central, source-grounded meaning.',",
              "'The headline supplies named identity. The image should add one central, source-grounded meaning. A source-led fallback may intentionally add no explanatory assertion when the source claim failed audit; such a card is safe only when it stays neutral and introduces no unsupported detail.',",
              1,
          )
          text = text.replace('# Visual Compiler v5 fresh source-grounded A/B evaluation', '# Visual Compiler v7 unseen route-aware A/B evaluation')
          text = text.replace('Eligible compiler claims before rendering', 'Eligible explanatory claims before routing')
          text = text.replace('| Metric | Current | Compiler v5 |', '| Metric | Current | V7 selected |')
          safe_anchor = "    `| Visual headline-paired pass | ${metric('current', 'visualPass')}/${count} (${percent(metric('current', 'visualPass'), count)}) | ${metric('compiler', 'visualPass')}/${count} (${percent(metric('compiler', 'visualPass'), count)}) |`,"
          if safe_anchor not in text:
              raise SystemExit('Visual pass metric line was not found.')
          text = text.replace(
              safe_anchor,
              safe_anchor + "\n    `| Route-safe pass | ${metric('current', 'safePass')}/${count} (${percent(metric('current', 'safePass'), count)}) | ${metric('compiler', 'safePass')}/${count} (${percent(metric('compiler', 'safePass'), count)}) |`,",
              1,
          )
          text = text.replace('Blinded preference: compiler', 'Blinded preference: V7')
          text = text.replace('Compiler preference excluding ties', 'V7 preference excluding ties')
          text = text.replace('Compiler P/V/Prod/Score', 'V7 P/V/Prod/Score')
          text = text.replace('| # | Story | Role | Mapping | Claim |', '| # | Story | Role | Route | Claim |')
          row_prefix = "`| ${row.rank} | ${row.headline.replace(/\\|/g, '\\\\|')} | \\`${row.role}\\` | \\`${row.mappingMode}\\` |"
          row_replacement = "`| ${row.rank} | ${row.headline.replace(/\\|/g, '\\\\|')} | \\`${row.role}\\` | \\`${row.renderMode}\\` |"
          if row_prefix in text:
              text = text.replace(row_prefix, row_replacement, 1)
          text = text.replace("${source.toUpperCase()}${preferred ? ' • PREFERRED' : ''}", "${source === 'compiler' ? 'V7 SELECTED' : 'CURRENT'}${preferred ? ' • PREFERRED' : ''}")
          text = text.replace("claim ${row.claimEligible ? 'PASS' : 'FAIL'} • ${xml(row.role)} • ${xml(row.mappingMode)}", "claim ${row.claimEligible ? 'PASS' : 'FALLBACK'} • ${xml(row.role)} • ${xml(row.renderMode)}")
          text = text.replace('[v5-eval]', '[v7-eval]')
          text = text.replace("'X-Title': 'AI Today Brief v5 role-aware visual evaluation'", "'X-Title': 'AI Today Brief v7 route-aware visual evaluation'")
          evaluate.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck generated v7 A-B harnesses
        run: npm run typecheck

      - name: Persist validated harnesses before paid calls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-compiler-v7-render-ab.ts scripts/visual-compiler-v7-evaluate-ab.ts
          if git diff --cached --quiet; then
            echo "V7 harnesses already persisted."
          else
            git commit -m "Add unseen routed v7 A-B harnesses"
            git fetch origin experiment/visual-compiler-v7-role-router-20260812
            git rebase origin/experiment/visual-compiler-v7-role-router-20260812
            SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812
          fi

      - name: Render exact current and routed v7 candidates
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V7_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V7_ROUTED_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-fresh-ab
        run: npx tsx scripts/visual-compiler-v7-render-ab.ts

      - name: Evaluate routed v7 cards blinded
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V7_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V7_ROUTED_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-fresh-ab
        run: npx tsx scripts/visual-compiler-v7-evaluate-ab.ts

      - name: Upload complete v7 unseen A-B package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-fresh-ab-evaluated
          path: artifacts/visual-compiler-v7-fresh-ab
          if-no-files-found: error
          retention-days: 14

      - name: Persist unseen v7 evaluation on isolated branch
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/results
          cp artifacts/visual-compiler-v7-fresh-ab/render-report.md experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-fresh-ab/render-manifest.json experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-fresh-ab/blind-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-fresh-ab/evaluation-report.md experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-fresh-ab/evaluation.json experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-fresh-ab/evaluated-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/results/run-id.txt
          git add experiments/visual-compiler-v7/fresh-holdout/results
          git commit -m "Record unseen routed v7 A-B results [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812
