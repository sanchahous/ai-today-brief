name: Visual compiler v5 certainty and role repair

on:
  push:
    branches:
      - experiment/visual-compiler-v5-fresh-holdout-20260812
    paths:
      - .github/workflows/visual-compiler-v5-certainty-role-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Normalize source certainty and persist fresh claims
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v5-fresh-holdout-20260812

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch certainty alignment and role guard
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/weekly-digest/visual-auto-claim-v5.ts')
          text = source.read_text()

          old_default = "  return 'uncertain';\n}\n\nfunction certaintyAssertiveness"
          new_default = "  return 'reported';\n}\n\nfunction certaintyAssertiveness"
          if old_default in text:
              text = text.replace(old_default, new_default, 1)
          elif "return 'reported';\n}\n\nfunction certaintyAssertiveness" not in text:
              raise SystemExit('Could not locate inferSourceCertainty default.')

          guard_start = text.index('function guardedCertainty(')
          guard_end = text.index('\n\nfunction inferRole', guard_start)
          new_guard = r'''function guardedCertainty(
            requested: VisualCertainty,
            source: VisualCertainty,
          ): { certainty: VisualCertainty; warning: string | null } {
            if (requested === source) return { certainty: source, warning: null };
            if (certaintyAssertiveness(requested) > certaintyAssertiveness(source)) {
              return {
                certainty: source,
                warning: `certainty_downgraded_${requested}_to_${source}`,
              };
            }
            return {
              certainty: source,
              warning: `certainty_aligned_${requested}_to_${source}`,
            };
          }'''
          text = text[:guard_start] + new_guard + text[guard_end:]

          role_end_marker = '\n\nfunction inferMetricDirection'
          role_end = text.index(role_end_marker)
          role_helpers = r'''

          function sourceHasExactMetric(story: HoldoutStoryInput): boolean {
            return /(?:[$€£]\s*\d|\b\d+(?:\.\d+)?\s*(?:%|x|×|million|billion|trillion|tokens?|milliseconds?|ms|seconds?|minutes?|hours?)\b)/i.test(
              sourceText(story),
            );
          }

          function guardExplanatoryRole(
            requested: VisualExplanatoryRole,
            raw: RawV5Claim,
            story: HoldoutStoryInput,
          ): { role: VisualExplanatoryRole; warning: string | null } {
            if (
              requested !== 'quantitative_result' &&
              requested !== 'benchmark_comparison'
            ) {
              return { role: requested, warning: null };
            }
            const facts = Array.isArray(raw.quantitative_facts)
              ? raw.quantitative_facts
              : [];
            if (facts.length > 0 || sourceHasExactMetric(story)) {
              return { role: requested, warning: null };
            }
            const source = sourceText(story);
            const role: VisualExplanatoryRole =
              /\b(by|because|via|using|converts?|converting|intercepts?|caching|compression|compresses?|proxy|fuzzing|property-based)\b/i.test(
                source,
              )
                ? 'causal_mechanism'
                : 'capability_access';
            return {
              role,
              warning: `role_aligned_${requested}_to_${role}_without_exact_metric`,
            };
          }'''
          if 'function guardExplanatoryRole(' not in text:
              text = text[:role_end] + role_helpers + text[role_end:]

          old_parse = "  const warnings: string[] = [];\n  const role = inferRole(raw, story);"
          new_parse = """  const warnings: string[] = [];
          const roleResult = guardExplanatoryRole(inferRole(raw, story), raw, story);
          const role = roleResult.role;
          if (roleResult.warning) warnings.push(roleResult.warning);"""
          if old_parse in text:
              text = text.replace(old_parse, new_parse, 1)
          elif 'const roleResult = guardExplanatoryRole' not in text:
              raise SystemExit('Could not locate parse role assignment.')

          source.write_text(text)

          test = Path('src/lib/weekly-digest/visual-auto-claim-v5-certainty-role.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import {
            parseAutoVisualClaimV5,
            validateAutoVisualClaimV5,
          } from './visual-auto-claim-v5';
          import type { HoldoutStoryInput } from './visual-auto-claim';

          function story(overrides: Partial<HoldoutStoryInput> = {}): HoldoutStoryInput {
            return {
              week_start: '2026-06-29',
              week_end: '2026-07-05',
              rank: 1,
              revision_item_id: 'certainty-story',
              title: 'Prompt caching avoids repeated token billing',
              summary: 'Prompt caching reduces repeated processing when conversation history is structured correctly.',
              why: 'Teams reduce unnecessary cloud API costs.',
              practical: null,
              takeaway: null,
              ...overrides,
            };
          }

          function raw(overrides: Record<string, unknown> = {}) {
            return {
              story_id: 'certainty-story',
              explanatory_role: 'causal_mechanism',
              certainty: 'uncertain',
              mapping_mode: 'literal',
              identity: 'the structured prompt and cached context workload',
              change: 'reuse previously processed context instead of billing it again',
              visual_driver: 'a cache intercepts repeated context before duplicate cloud processing',
              visible_outcome: 'the repeated workload becomes smaller and costs less',
              core_claim: 'prompt caching prevents duplicate processing and reduces cost',
              metric: null,
              labels: ['PROMPT', 'CACHE', 'REUSE'],
              quantitative_facts: [],
              states: [],
              comparison: null,
              layers: [],
              routing: null,
              required_visible_delta: '',
              forbidden_contradictions: [],
              grammar: {
                context_glyph: 'context_stack',
                mechanism_glyph: 'database',
                outcome_glyph: 'coins',
                branch_glyphs: null,
                relation: 'flow',
                outcome_signal: 'lower_cost',
                human_behavior: false,
              },
              ...overrides,
            };
          }

          describe('VisualClaim v5 source certainty alignment', () => {
            it('aligns an unsupported uncertain default to reported source certainty', () => {
              const value = parseAutoVisualClaimV5(raw(), story());
              expect(value.semantics.certainty).toBe('reported');
              expect(value.claim.coreClaim).toMatch(/reported/i);
              expect(value.extractionWarnings).toContain(
                'certainty_aligned_uncertain_to_reported',
              );
              expect(validateAutoVisualClaimV5(value)).toEqual([]);
            });

            it('reclassifies a non-numeric compression story away from quantitative_result', () => {
              const source = story({
                revision_item_id: 'optical-compression',
                title: 'Cutting Claude Code Token Costs with Optical Context Compression',
                summary:
                  'A local proxy intercepts requests and converts verbose text context into compact PNG images, squeezing it to a fraction of the original token cost.',
                why: 'Vision reads the compressed representation instead of repeatedly sending dense text.',
              });
              const value = parseAutoVisualClaimV5(
                raw({
                  story_id: 'optical-compression',
                  explanatory_role: 'quantitative_result',
                  identity: 'the local proxy and verbose text context',
                  visual_driver: 'the proxy converts dense text context into a compact optical representation',
                  visible_outcome: 'the same context occupies a smaller token workload',
                  core_claim: 'optical context compression reduces the token workload',
                  metric: {
                    direction: 'decrease',
                    comparison_target: 'the original token cost',
                    baseline_label: 'TEXT CONTEXT',
                    result_label: 'OPTICAL CONTEXT',
                  },
                  labels: ['TEXT', 'PROXY', 'PNG'],
                  quantitative_facts: [],
                }),
                source,
              );

              expect(value.semantics.explanatoryRole).toBe('causal_mechanism');
              expect(value.semantics.metric).toBeNull();
              expect(value.extractionWarnings).toContain(
                'role_aligned_quantitative_result_to_causal_mechanism_without_exact_metric',
              );
              expect(validateAutoVisualClaimV5(value)).toEqual([]);
            });
          });
          """)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test certainty and role repair
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-auto-claim-v5-short-identity.test.ts
          src/lib/weekly-digest/visual-auto-claim-v5-certainty-role.test.ts
          src/lib/weekly-digest/visual-generic-svg-v5.test.ts

      - name: Typecheck repaired repository
        run: npm run typecheck

      - name: Persist deterministic repair before LLM calls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/weekly-digest/visual-auto-claim-v5.ts \
            src/lib/weekly-digest/visual-auto-claim-v5-certainty-role.test.ts
          git commit -m "Align v5 certainty and guard non-numeric quantitative roles"
          git push origin HEAD:experiment/visual-compiler-v5-fresh-holdout-20260812

      - name: Extract audit and repair all fresh VisualClaims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_EXTRACT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_OUT_DIR: artifacts/visual-compiler-v5-fresh
        run: npx tsx scripts/visual-compiler-v5-extract-audit.ts

      - name: Persist fresh claim reports
        run: |
          mkdir -p experiments/visual-compiler-v5/fresh-holdout/output
          cp artifacts/visual-compiler-v5-fresh/v5-claims.json experiments/visual-compiler-v5/fresh-holdout/output/
          cp artifacts/visual-compiler-v5-fresh/v5-claim-report.md experiments/visual-compiler-v5/fresh-holdout/output/
          cp artifacts/visual-compiler-v5-fresh/v5-usage.json experiments/visual-compiler-v5/fresh-holdout/output/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v5/fresh-holdout/output/claim-run-id.txt
          git add experiments/visual-compiler-v5/fresh-holdout/output
          git commit -m "Record source-aligned fresh v5 claims [skip ci]"
          git push origin HEAD:experiment/visual-compiler-v5-fresh-holdout-20260812

      - name: Upload source-aligned claim package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v5-fresh-claims-source-aligned
          path: artifacts/visual-compiler-v5-fresh
          if-no-files-found: error
          retention-days: 14
