name: Visual compiler v5 fresh A-B persisted

on:
  push:
    branches:
      - experiment/visual-compiler-v5-fresh-holdout-20260812
    paths:
      - .github/workflows/visual-compiler-v5-fresh-ab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ab:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[workflow-fix-only]') }}
    name: Render evaluate and persist seven fresh A-B cards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v5-fresh-holdout-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all v5 scripts before image calls
        run: npm run typecheck

      - name: Render exact current and v5 compiler cards
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V5_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V5_CLAIMS: experiments/visual-compiler-v5/fresh-holdout/output/v5-claims.json
          VISUAL_V5_AB_OUT_DIR: artifacts/visual-compiler-v5-fresh-ab
        run: npx tsx scripts/visual-compiler-v5-render-ab.ts

      - name: Run role-aware source-grounded blinded evaluation
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V5_CLAIMS: experiments/visual-compiler-v5/fresh-holdout/output/v5-claims.json
          VISUAL_V5_AB_OUT_DIR: artifacts/visual-compiler-v5-fresh-ab
        run: npx tsx scripts/visual-compiler-v5-evaluate-ab.ts

      - name: Persist review and result files on experiment branch
        run: |
          mkdir -p experiments/visual-compiler-v5/fresh-holdout/review
          mkdir -p experiments/visual-compiler-v5/fresh-holdout/results
          cp artifacts/visual-compiler-v5-fresh-ab/blind-contact-sheet.png experiments/visual-compiler-v5/fresh-holdout/review/
          cp artifacts/visual-compiler-v5-fresh-ab/render-report.md experiments/visual-compiler-v5/fresh-holdout/results/
          cp artifacts/visual-compiler-v5-fresh-ab/render-manifest.json experiments/visual-compiler-v5/fresh-holdout/results/
          cp artifacts/visual-compiler-v5-fresh-ab/evaluation-report.md experiments/visual-compiler-v5/fresh-holdout/results/
          cp artifacts/visual-compiler-v5-fresh-ab/evaluation.json experiments/visual-compiler-v5/fresh-holdout/results/
          cp artifacts/visual-compiler-v5-fresh-ab/evaluated-contact-sheet.png experiments/visual-compiler-v5/fresh-holdout/results/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v5/fresh-holdout/results/ab-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v5/fresh-holdout/review experiments/visual-compiler-v5/fresh-holdout/results
          if git diff --cached --quiet; then
            echo "No result changes to persist."
            exit 0
          fi
          git commit -m "Record fresh v5 A-B results [skip ci]"
          git fetch origin experiment/visual-compiler-v5-fresh-holdout-20260812
          git rebase origin/experiment/visual-compiler-v5-fresh-holdout-20260812
          git push origin HEAD:experiment/visual-compiler-v5-fresh-holdout-20260812

      - name: Upload complete A-B package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v5-fresh-ab-evaluated
          path: artifacts/visual-compiler-v5-fresh-ab
          if-no-files-found: warn
          retention-days: 14

