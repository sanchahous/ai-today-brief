name: Visual affordance v10 visual and critic repair v2

on:
  push:
    branches:
      - experiment/visual-affordance-router-v10-20260813
    paths:
      - .github/workflows/visual-affordance-v10-visual-repair-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Replace visual grammar functions and repair two-stage critic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-affordance-router-v10-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply robust source repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          treatment_path = Path('src/lib/weekly-digest/visual-affordance-treatment-v10.ts')
          treatment = treatment_path.read_text()

          same_system = r'''function sameSystemOutputVariabilityScene(
            width: number,
            height: number,
          ): string {
            const taskX = width * 0.045;
            const taskY = height * 0.34;
            const taskW = width * 0.22;
            const taskH = height * 0.28;
            const modelCx = width * 0.47;
            const modelCy = height * 0.5;
            const modelSize = Math.min(width, height) * 0.145;
            const outputX = width * 0.69;
            const outputW = width * 0.265;
            const outputH = height * 0.31;
            const topY = height * 0.105;
            const bottomY = height * 0.585;
            const artifactX = outputX + outputW * 0.06;
            const artifactW = outputW * 0.88;
            const artifactH = outputH * 0.82;
            const nodeW = artifactW * 0.2;
            const nodeH = artifactH * 0.18;
            const bottomNodes = [
              [artifactX + artifactW * 0.12, bottomY + outputH * 0.12],
              [artifactX + artifactW * 0.62, bottomY + outputH * 0.12],
              [artifactX + artifactW * 0.12, bottomY + outputH * 0.61],
              [artifactX + artifactW * 0.62, bottomY + outputH * 0.61],
            ] as const;
            const bottomBoxes = bottomNodes
              .map(
                ([x, y], index) =>
                  `<rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="11" fill="${index % 2 ? COLORS.violet : COLORS.cyan}" fill-opacity="0.25" stroke="${COLORS.cyanLight}" stroke-width="2"/>`,
              )
              .join('');
            const bottomLinks = `<path d="M${bottomNodes[0][0] + nodeW} ${bottomNodes[0][1] + nodeH / 2}L${bottomNodes[3][0]} ${bottomNodes[3][1] + nodeH / 2}M${bottomNodes[1][0]} ${bottomNodes[1][1] + nodeH}L${bottomNodes[2][0] + nodeW} ${bottomNodes[2][1]}M${bottomNodes[0][0] + nodeW / 2} ${bottomNodes[0][1] + nodeH}V${bottomNodes[2][1]}" fill="none" stroke="${COLORS.amber}" stroke-width="4" stroke-linecap="round"/>`;
            return `${panel(width * 0.025, height * 0.16, width * 0.27, height * 0.68)}
              ${panel(width * 0.36, height * 0.23, width * 0.22, height * 0.54, COLORS.violet)}
              ${panel(outputX, topY, outputW, outputH, COLORS.green)}
              ${panel(outputX, bottomY, outputW, outputH, COLORS.amber)}
              ${taskCard(taskX, taskY, taskW, taskH)}
              ${chip(modelCx, modelCy, modelSize)}
              ${arrow(taskX + taskW, taskY + taskH / 2, modelCx - modelSize * 0.72, modelCy)}
              ${arrow(modelCx + modelSize * 0.72, modelCy - modelSize * 0.16, outputX - width * 0.018, topY + outputH / 2)}
              ${arrow(modelCx + modelSize * 0.72, modelCy + modelSize * 0.16, outputX - width * 0.018, bottomY + outputH / 2)}
              <circle cx="${modelCx + modelSize * 0.92}" cy="${modelCy - modelSize * 0.38}" r="11" fill="${COLORS.green}" stroke="${COLORS.cyanLight}" stroke-width="3"/>
              <circle cx="${modelCx + modelSize * 0.92}" cy="${modelCy + modelSize * 0.38}" r="11" fill="${COLORS.amber}" stroke="${COLORS.cyanLight}" stroke-width="3"/>
              <g data-run-output="A">${modularArtifact(artifactX, topY + outputH * 0.08, artifactW, artifactH)}</g>
              <g data-run-output="B">${bottomBoxes}${bottomLinks}</g>`;
          }'''
          treatment = replace_between(
              treatment,
              'function sameSystemOutputVariabilityScene(',
              'function streamBlocks(',
              same_system,
          )

          session_scene = r'''function controlledSessionWorkflowScene(width: number, height: number): string {
            const leftX = width * 0.025;
            const leftY = height * 0.15;
            const leftW = width * 0.27;
            const leftH = height * 0.7;
            const cacheX = width * 0.35;
            const cacheY = height * 0.12;
            const cacheW = width * 0.21;
            const cacheH = height * 0.27;
            const splitCx = width * 0.47;
            const splitCy = height * 0.65;
            const rightX = width * 0.665;
            const rightY = height * 0.08;
            const rightW = width * 0.31;
            const rightH = height * 0.84;
            const thresholdY = leftY + leftH * 0.79;
            const sessionX = rightX + rightW * 0.1;
            const sessionW = rightW * 0.76;
            const sessionH = rightH * 0.16;
            const sessionYs = [0.1, 0.36, 0.62].map(
              (fraction) => rightY + rightH * fraction,
            );
            const cacheBlocks = [0, 1, 2]
              .map(
                (index) =>
                  `<rect x="${cacheX + cacheW * 0.19}" y="${cacheY + cacheH * (0.27 + index * 0.2)}" width="${cacheW * 0.62}" height="${cacheH * 0.12}" rx="10" fill="${COLORS.cyan}" fill-opacity="${0.32 + index * 0.13}" stroke="${COLORS.cyanLight}" stroke-opacity="0.5" stroke-width="2"/>`,
              )
              .join('');
            const sessionCards = sessionYs
              .map((y, index) => {
                const cachedY = y + sessionH * 0.18;
                return `<g data-bounded-session="${index + 1}"><rect x="${sessionX}" y="${y}" width="${sessionW}" height="${sessionH}" rx="18" fill="#071827" stroke="${COLORS.green}" stroke-opacity="${0.55 + index * 0.1}" stroke-width="3"/><rect x="${sessionX + sessionW * 0.08}" y="${cachedY}" width="${sessionW * 0.36}" height="${sessionH * 0.18}" rx="8" fill="${COLORS.cyan}" fill-opacity="0.52" stroke="${COLORS.cyanLight}" stroke-opacity="0.44"/><rect x="${sessionX + sessionW * 0.08}" y="${cachedY + sessionH * 0.29}" width="${sessionW * 0.58}" height="${sessionH * 0.18}" rx="8" fill="${COLORS.amber}" fill-opacity="0.45"/><rect x="${sessionX + sessionW * 0.08}" y="${cachedY + sessionH * 0.57}" width="${sessionW * 0.47}" height="${sessionH * 0.18}" rx="8" fill="${COLORS.amber}" fill-opacity="0.32"/></g>`;
              })
              .join('');
            const splitBranches = sessionYs
              .map(
                (y) =>
                  `<path d="M${splitCx + width * 0.035} ${splitCy}C${width * 0.58} ${splitCy},${width * 0.61} ${y + sessionH / 2},${sessionX - width * 0.012} ${y + sessionH / 2}" fill="none" stroke="${COLORS.cyanLight}" stroke-width="5" stroke-linecap="round" marker-end="url(#v10-arrow)"/>`,
              )
              .join('');
            const cacheRail = sessionYs
              .map(
                (y) =>
                  `<path d="M${cacheX + cacheW} ${cacheY + cacheH * 0.5}C${width * 0.61} ${cacheY + cacheH * 0.5},${width * 0.62} ${y + sessionH * 0.25},${sessionX + sessionW * 0.07} ${y + sessionH * 0.25}" fill="none" stroke="${COLORS.cyan}" stroke-opacity="0.58" stroke-width="3"/>`,
              )
              .join('');
            return `${panel(leftX, leftY, leftW, leftH, COLORS.amber)}
              ${panel(cacheX, cacheY, cacheW, cacheH, COLORS.cyan)}
              ${panel(width * 0.37, height * 0.48, width * 0.2, height * 0.34, COLORS.violet)}
              ${panel(rightX, rightY, rightW, rightH, COLORS.green)}
              ${streamBlocks(leftX + leftW * 0.1, leftY + leftH * 0.06, leftW * 0.78, 10, 8)}
              <path d="M${leftX + leftW * 0.08} ${thresholdY}H${leftX + leftW * 0.92}" stroke="${COLORS.rose}" stroke-width="6" stroke-dasharray="14 10"/>
              ${arrow(leftX + leftW, leftY + leftH * 0.29, cacheX - width * 0.015, cacheY + cacheH * 0.5)}
              ${arrow(leftX + leftW, leftY + leftH * 0.68, splitCx - width * 0.055, splitCy)}
              <g data-cache-reservoir="true"><ellipse cx="${cacheX + cacheW * 0.5}" cy="${cacheY + cacheH * 0.22}" rx="${cacheW * 0.32}" ry="${cacheH * 0.1}" fill="#0F172A" stroke="${COLORS.cyan}" stroke-width="4"/><rect x="${cacheX + cacheW * 0.18}" y="${cacheY + cacheH * 0.22}" width="${cacheW * 0.64}" height="${cacheH * 0.6}" rx="18" fill="#0F172A" stroke="${COLORS.cyan}" stroke-width="4"/>${cacheBlocks}</g>
              <g data-session-splitter="true"><circle cx="${splitCx}" cy="${splitCy}" r="${Math.min(width, height) * 0.055}" fill="#0F172A" stroke="${COLORS.violet}" stroke-width="5"/><path d="M${splitCx - 24} ${splitCy}H${splitCx + 2}M${splitCx + 2} ${splitCy}L${splitCx + 30} ${splitCy - 30}M${splitCx + 2} ${splitCy}L${splitCx + 30} ${splitCy}M${splitCx + 2} ${splitCy}L${splitCx + 30} ${splitCy + 30}" fill="none" stroke="${COLORS.cyanLight}" stroke-width="7" stroke-linecap="round"/></g>
              ${sessionCards}${splitBranches}${cacheRail}
              ${monitorGauge(rightX + rightW * 0.52, rightY + rightH * 0.92, rightW * 0.16)}`;
          }'''
          treatment = replace_between(
              treatment,
              'function controlledSessionWorkflowScene(',
              'function pill(',
              session_scene,
          )

          overlay_function = r'''function overlays(
            treatment: AffordanceTreatmentV10,
            width: number,
            height: number,
          ): string {
            const labels = treatment.labels.slice(0, 3);
            if (treatment.kind === 'same_system_output_variability') {
              return [
                labels[0] ? pill(labels[0], 46, 38, true) : '',
                labels[1] ? pill(labels[1], width * 0.69, 38) : '',
                labels[2] ? pill(labels[2], width * 0.69, height * 0.54) : '',
              ].join('');
            }
            if (treatment.kind === 'controlled_session_workflow') {
              return [
                labels[0] ? pill(labels[0], width * 0.35, height * 0.055, true) : '',
                labels[1] ? pill(labels[1], width * 0.425, height * 0.43) : '',
                labels[2] ? pill(labels[2], width * 0.76, height * 0.8) : '',
              ].join('');
            }
            return labels
              .map((label, index) =>
                pill(label, 42, 42 + index * 47, index === 0),
              )
              .join('');
          }'''
          treatment = replace_between(
              treatment,
              'function overlays(',
              'export function renderAffordanceVisualSvgV10(',
              overlay_function,
          )
          treatment = treatment.replace(
              'overlays(input.treatment, width)',
              'overlays(input.treatment, width, height)',
          )
          treatment = treatment.replace(
              'overlays(treatment, width)',
              'overlays(treatment, width, height)',
          )

          prompt_start = treatment.index('export function affordanceImagePromptV10(')
          prompt_function = r'''export function affordanceImagePromptV10(
            treatment: AffordanceTreatmentV10,
            story: HoldoutStoryInput,
          ): string {
            if (treatment.kind !== 'bounded_assistance') {
              throw new Error(`Treatment ${treatment.kind} is deterministic.`);
            }
            return [
              'Premium cinematic editorial photograph for a technology magazine, wide 16:9 composition, coherent realistic lighting, natural materials, restrained cyan accent, one readable visual idea.',
              `Approved story context: ${story.title}. ${story.summary}`,
              'Show exactly one adult knowledge worker in deep concentration at a large tactile logic board made of blank interlocking geometric tiles. The face, eyes, upper torso and both forearms are visible.',
              'Exactly two human hands are visible, both anatomically correct and visibly attached to this same person. One hand places one dark geometric tile into the board; the other hand steadies the board. No other person, arm, hand, reflection or partial body is present.',
              'A small physical AI assistance device is clearly visible on the table at frame left. The device is the unmistakable source of one narrow cyan cone of light aimed at exactly one empty socket and one candidate tile. The light starts at the device, ends on that one bounded target and does nothing else.',
              'Most of the logic board has already been assembled by the person. The person remains physically engaged and chooses where to place the tile; the AI device does not move objects, write, type or complete the puzzle.',
              'Behind a frosted glass divider, distraction is represented only by diffuse defocused colored light and motion blur, never boxes, icons, screens, diagrams or interface shapes.',
              'The foreground must communicate sustained concentration, active human thinking and one bounded hint. It must not resemble a generic gear workshop or passive automation.',
              'All tiles and surfaces are blank and unmarked. No paper, document, monitor, code or diagram appears in the foreground.',
              'Absolutely no readable text, letters, numbers, symbols, logos, captions, UI, watermark, extra fingers, extra limbs, extra hands, detached hands, fused objects, off-screen laser source or impossible anatomy.',
              'Passive automation is forbidden. A beam without a visible physical source and visible target is forbidden.',
            ].join(' ');
          }
          '''
          treatment = treatment[:prompt_start] + prompt_function.strip() + '\n'
          treatment_path.write_text(treatment)

          integrity_path = Path('src/lib/weekly-digest/visual-integrity-v10.ts')
          integrity = integrity_path.read_text()
          beam_pattern = re.compile(
              r"  if \(observation\.beamPresent && !observation\.beamSourceVisible\) \{\n"
              r"    blockers\.push\('beam_source_missing'\);\n"
              r"  \}\n"
              r"  if \(observation\.beamPresent && !observation\.beamTargetVisible\) \{\n"
              r"    blockers\.push\('beam_target_missing'\);\n"
              r"  \}\n"
              r"  if \(observation\.beamPresent && !observation\.beamPurposeClear\) \{\n"
              r"    blockers\.push\('beam_purpose_unclear'\);\n"
              r"  \}\n"
          )
          integrity, count = beam_pattern.subn('', integrity, count=1)
          if count != 1:
              raise SystemExit(f'Expected one universal beam block; replaced {count}.')
          anchor = """  if (
            grammar === 'cinematic_domain_scene' &&
            !observation.domainContextVisible
          ) {"""
          beam_insert = """  if (
            (grammar === 'cinematic_domain_scene' ||
              grammar === 'one_to_one_physical_analogy') &&
            observation.beamPresent
          ) {
            if (!observation.beamSourceVisible) blockers.push('beam_source_missing');
            if (!observation.beamTargetVisible) blockers.push('beam_target_missing');
            if (!observation.beamPurposeClear) blockers.push('beam_purpose_unclear');
          }

          """
          if anchor not in integrity:
              raise SystemExit('Cinematic domain integrity anchor was not found.')
          integrity = integrity.replace(anchor, beam_insert + anchor, 1)
          integrity_path.write_text(integrity)

          evaluator_path = Path('scripts/visual-affordance-v10-targeted-evaluate.ts')
          evaluator = evaluator_path.read_text()
          evaluator = evaluator.replace(
              "  mappingComplete: boolean;\n  labelsSupportedByPixels: boolean;",
              "  mappingComplete: boolean;\n  pixelActionSupportsClaim: boolean;\n  pixelOutcomeSupportsClaim: boolean;\n  pixelRelationSupportsClaim: boolean;\n  domainContextSupported: boolean;\n  labelsSupportedByPixels: boolean;",
              1,
          )
          evaluator = evaluator.replace(
              "    mappingComplete: bool(row.mapping_complete),\n    labelsSupportedByPixels: bool(row.labels_supported_by_pixels),",
              "    mappingComplete: bool(row.mapping_complete),\n    pixelActionSupportsClaim: bool(row.pixel_action_supports_claim),\n    pixelOutcomeSupportsClaim: bool(row.pixel_outcome_supports_claim),\n    pixelRelationSupportsClaim: bool(row.pixel_relation_supports_claim),\n    domainContextSupported: bool(row.domain_context_supported),\n    labelsSupportedByPixels: bool(row.labels_supported_by_pixels),",
              1,
          )
          evaluator = evaluator.replace(
              "'core_action_visible, outcome_visible and causal_relation_visible must be based only on visible pixels.',",
              "'List only literal visible actions and outcomes. Do not decide whether they support the hidden story at this stage.',",
              1,
          )
          evaluator = evaluator.replace(
              "          'mapping_complete means the visible objects/actions/outcome map one-to-one to the approved source claim without unexplained props.',\n          'labels_carry_claim is true when the central meaning would disappear after hiding the labels.',",
              "          'mapping_complete means the visible objects/actions/outcome map one-to-one to the approved source claim without unexplained props.',\n          'pixel_action_supports_claim, pixel_outcome_supports_claim and pixel_relation_supports_claim must be grounded in the first-stage literal observation, not inferred from labels or the intended prompt.',\n          'domain_context_supported means the pixels visibly anchor the real domain or human situation needed by this story.',\n          'labels_carry_claim is true when the central meaning would disappear after hiding the labels.',",
              1,
          )
          evaluator = evaluator.replace(
              "'For each card return headline_pair_understood, source_grounded, certainty_preserved, unsupported_specific_visible, mapping_complete, labels_supported_by_pixels, labels_carry_claim, thumbnail_readable, misleading, instant_meaning, visual_beauty, brand_consistency, originality and summary.',",
              "'For each card return headline_pair_understood, source_grounded, certainty_preserved, unsupported_specific_visible, mapping_complete, pixel_action_supports_claim, pixel_outcome_supports_claim, pixel_relation_supports_claim, domain_context_supported, labels_supported_by_pixels, labels_carry_claim, thumbnail_readable, misleading, instant_meaning, visual_beauty, brand_consistency, originality and summary.',",
              1,
          )
          evaluator = evaluator.replace(
              'mapping_complete:boolean,labels_supported_by_pixels:boolean,labels_carry_claim:boolean,thumbnail_readable:boolean',
              'mapping_complete:boolean,pixel_action_supports_claim:boolean,pixel_outcome_supports_claim:boolean,pixel_relation_supports_claim:boolean,domain_context_supported:boolean,labels_supported_by_pixels:boolean,labels_carry_claim:boolean,thumbnail_readable:boolean',
              1,
          )
          evaluator = evaluator.replace(
              'coreActionVisible: blind.coreActionVisible,\n    outcomeVisible: blind.outcomeVisible,\n    causalRelationVisible: blind.causalRelationVisible,\n    domainContextVisible: blind.domainContextVisible,',
              'coreActionVisible: card.pixelActionSupportsClaim,\n    outcomeVisible: card.pixelOutcomeSupportsClaim,\n    causalRelationVisible: card.pixelRelationSupportsClaim,\n    domainContextVisible: card.domainContextSupported,',
              1,
          )
          evaluator = evaluator.replace(
              '    card.certaintyPreserved &&\n    card.labelsSupportedByPixels &&',
              '    card.certaintyPreserved &&\n    card.pixelActionSupportsClaim &&\n    card.pixelOutcomeSupportsClaim &&\n    card.pixelRelationSupportsClaim &&\n    card.labelsSupportedByPixels &&',
              1,
          )
          required_tokens = [
              'pixelActionSupportsClaim',
              'pixelOutcomeSupportsClaim',
              'pixelRelationSupportsClaim',
              'domainContextSupported',
          ]
          for token in required_tokens:
              if evaluator.count(token) < 3:
                  raise SystemExit(f'Evaluator patch incomplete for {token}.')
          evaluator_path.write_text(evaluator)

          tests_path = Path('src/lib/weekly-digest/visual-integrity-v10.test.ts')
          tests = tests_path.read_text()
          anchor = "  it('blocks a deterministic card with a broken arrow even when all semantics are present', () => {"
          addition = """  it('does not interpret diagram arrows as unexplained cinematic beams', () => {
            const gate = evaluateVisualIntegrityV10(
              'controlled_comparison',
              cleanObservation({
                beamPresent: true,
                beamSourceVisible: false,
                beamTargetVisible: false,
                beamPurposeClear: false,
              }),
            );
            expect(gate.blockers).not.toContain('beam_source_missing');
            expect(gate.blockers).not.toContain('beam_target_missing');
            expect(gate.blockers).not.toContain('beam_purpose_unclear');
          });

          """
          if anchor not in tests:
              raise SystemExit('Integrity test insertion anchor was not found.')
          tests_path.write_text(tests.replace(anchor, addition + anchor, 1))

          treatment_tests_path = Path('src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts')
          tests = treatment_tests_path.read_text()
          tests = tests.replace(
              "    expect(final).toContain('RUN B');",
              "    expect(final).toContain('RUN B');\n    expect(pixels).toContain('data-run-output=\"A\"');\n    expect(pixels).toContain('data-run-output=\"B\"');",
              1,
          )
          tests = tests.replace(
              "    expect(svg).toContain('MONITOR');",
              "    expect(svg).toContain('MONITOR');\n    expect(svg).toContain('data-cache-reservoir=\"true\"');\n    expect(svg).toContain('data-session-splitter=\"true\"');\n    expect(svg).toContain('data-bounded-session=\"1\"');",
              1,
          )
          treatment_tests_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate repaired visual grammar and critic
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-affordance-router-v10.test.ts
          src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts
          src/lib/weekly-digest/visual-integrity-v10.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Persist repaired visual system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/weekly-digest/visual-affordance-treatment-v10.ts \
            src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts \
            src/lib/weekly-digest/visual-integrity-v10.ts \
            src/lib/weekly-digest/visual-integrity-v10.test.ts \
            scripts/visual-affordance-v10-targeted-evaluate.ts
          git commit -m "Repair V10 visual grammar and story-aware integrity mapping"
          git fetch origin experiment/visual-affordance-router-v10-20260813
          git rebase origin/experiment/visual-affordance-router-v10-20260813
          SKIP_E2E=1 git push origin HEAD:experiment/visual-affordance-router-v10-20260813
