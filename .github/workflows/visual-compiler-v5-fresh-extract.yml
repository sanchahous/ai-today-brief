name: Visual compiler v5 fresh holdout claims

on:
  push:
    branches:
      - experiment/visual-compiler-v5-fresh-holdout-20260812
    paths:
      - experiments/visual-compiler-v5/fresh-holdout/stories.json
      - src/lib/weekly-digest/visual-auto-claim-v5.ts
      - scripts/visual-compiler-v5-extract-audit.ts
      - .github/workflows/visual-compiler-v5-fresh-extract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    name: Extract audit and repair seven fresh VisualClaims
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run v5 tests
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-generic-svg-v5.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Extract audit and repair VisualClaims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_EXTRACT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_OUT_DIR: artifacts/visual-compiler-v5-fresh
        run: npx tsx scripts/visual-compiler-v5-extract-audit.ts

      - name: Upload v5 claim package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v5-fresh-claims
          path: artifacts/visual-compiler-v5-fresh
          if-no-files-found: error
          retention-days: 14
