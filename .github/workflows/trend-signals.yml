name: Trend signals

on:
  schedule:
    # Daily (04:30 UTC) — capture each tracked entity's GDELT news-volume trend
    # into entity_trend_signals (append-only). Was briefly trimmed to weekly to save
    # Actions minutes, but weekly + no retry meant a single failed run = 7 days stale
    # (a transient billing block on 2026-06-15 did exactly that), and GDELT 429s ~half
    # the entities per run — so daily is needed to accumulate usable density.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print parsed signals instead of writing'
        type: boolean
        default: false

concurrency:
  group: trend-signals
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture trend signals
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="--dry-run"
          fi
          npx tsx pipeline/scripts/backfill-trend-signals.ts $ARGS

      # Silent scheduled cron — alert the review chat on any failure so a broken
      # run is noticed same-day. Best-effort; never affects the job conclusion.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_REVIEW_CHAT_ID" ] && exit 0
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 15 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_REVIEW_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ <b>Trend signals FAILED</b> 🔗 ${RUN_URL}" \
            || true
