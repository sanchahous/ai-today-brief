name: Trend signals

on:
  schedule:
    # Weekly (Mon 04:30 UTC) — capture each tracked entity's GDELT news-volume trend
    # into entity_trend_signals (append-only). Was daily; trimmed to weekly to save
    # Actions minutes — the rising signal moves slowly enough that weekly is plenty.
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print parsed signals instead of writing'
        type: boolean
        default: false

concurrency:
  group: trend-signals
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture trend signals
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="--dry-run"
          fi
          npx tsx pipeline/scripts/backfill-trend-signals.ts $ARGS
