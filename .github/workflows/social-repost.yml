name: Social repost

on:
  schedule:
    # Daily 17:00 UTC = 20:00 Kyiv / 13:00 ET — after the evening editorial
    # pass, inside the US engagement window.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the posts instead of publishing"
        type: boolean
        default: false
      date:
        description: "Optional UTC edition date (YYYY-MM-DD), useful for a dry run"
        type: string
        required: false

concurrency:
  group: social-repost
  cancel-in-progress: false

jobs:
  repost:
    # Emergency legacy fallback only. The CMS queue is the source of truth;
    # leaving this repository variable unset prevents duplicate live posts.
    if: vars.ENABLE_LEGACY_SOCIAL_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Post top story
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # X posting is optional — the script skips X until these exist.
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Threads remains disabled until the repository variable explicitly
          # includes it, e.g. SOCIAL_CHANNELS=telegram,threads,x.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SOCIAL_CHANNELS: ${{ vars.SOCIAL_CHANNELS }}
        run: |
          ARGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS="--dry-run"
          fi
          if [[ -n "${{ inputs.date }}" ]]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          npx tsx pipeline/scripts/social-repost.ts $ARGS
