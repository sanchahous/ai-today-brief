name: Visual affordance router v10 calibration v2

on:
  push:
    branches:
      - experiment/visual-affordance-router-v10-20260813
    paths:
      - .github/workflows/visual-affordance-v10-calibration-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    name: Validate repaired owner calibration and hard gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-affordance-router-v10-20260813
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run owner-grounded visual tests
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-affordance-router-v10.test.ts
          src/lib/weekly-digest/visual-affordance-treatment-v10.test.ts
          src/lib/weekly-digest/visual-integrity-v10.test.ts
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-role-router-v7.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build owner calibration package
        env:
          VISUAL_V10_OUT_DIR: artifacts/visual-affordance-v10-calibration-v2
        run: npx tsx scripts/visual-affordance-v10-calibration.ts

      - name: Upload owner calibration package
        uses: actions/upload-artifact@v4
        with:
          name: visual-affordance-v10-calibration-v2
          path: artifacts/visual-affordance-v10-calibration-v2
          if-no-files-found: error
          retention-days: 30

      - name: Persist calibration report
        run: |
          mkdir -p experiments/visual-affordance-v10/calibration-v2
          cp artifacts/visual-affordance-v10-calibration-v2/owner-calibration-report.md experiments/visual-affordance-v10/calibration-v2/
          cp artifacts/visual-affordance-v10-calibration-v2/owner-calibration.json experiments/visual-affordance-v10/calibration-v2/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-affordance-v10/calibration-v2/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-affordance-v10/calibration-v2
          git commit -m "Record repaired V10 owner calibration [skip ci]"
          git fetch origin experiment/visual-affordance-router-v10-20260813
          git rebase origin/experiment/visual-affordance-router-v10-20260813
          SKIP_E2E=1 git push origin HEAD:experiment/visual-affordance-router-v10-20260813
