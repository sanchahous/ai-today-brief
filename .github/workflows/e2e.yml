name: E2E (Playwright)

on:
  # Playwright tests the built website, so it only needs to run on UI-affecting
  # changes. Skip docs/markdown/SQL/workflow-only AND pipeline-only PRs (the
  # pipeline never renders the site). PR-only: the post-merge push to main re-tested
  # an identical tree (squash merge), so it was pure duplicate spend — removed.
  pull_request:
    branches: [main]
    paths-ignore:
      - "wiki/**"
      - "raw/**"
      - "artifacts/**"
      - "**/*.md"
      - "supabase/migrations/**"
      - ".github/**"
      - "pipeline/**"

# A new push to a PR supersedes the previous commit — cancel its in-flight run
# instead of paying for an e2e against a commit that no longer matters. Keyed on the
# PR number (falls back to ref) so isolation stays per-PR if a trigger is added later.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Reuse the existing pipeline credentials. The URL and anon key are safe
      # to expose to the browser; never pass SCRAPPER_SERVICE_KEY to Next.js.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SCRAPPER_BASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the three browser engines (chromium/firefox/webkit) keyed on the
      # installed Playwright version. Biggest win is repeated pushes within a PR;
      # cross-PR reuse is partial since no run executes on main to prime a shared cache.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          # On a version bump the exact key misses; fall back to the latest cached
          # browser set so the install re-fetches only the delta. (cache-hit stays
          # false on a restore-keys match, so the full install below still runs.)
          restore-keys: |
            playwright-${{ runner.os }}-

      # Cache miss → full install (browser binaries + OS libs). Cache hit → only the
      # system libs (fast apt), since the cached binaries still need them at launch.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
