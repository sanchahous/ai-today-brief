name: Visual compiler v7 unseen routed A-B v3

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-unseen-ab-v3.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ab:
    name: Reproduce render evaluate and persist seven unseen stories
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect an already completed decision
        id: completed
        run: |
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          if git cat-file -e origin/experiment/visual-compiler-v7-role-router-20260812:experiments/visual-compiler-v7/fresh-holdout/results/v7-decision.json 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load source-audited routed claims
        if: steps.completed.outputs.done != 'true'
        run: |
          for attempt in $(seq 1 60); do
            git fetch origin experiment/visual-compiler-v7-role-router-20260812
            git checkout origin/experiment/visual-compiler-v7-role-router-20260812 -- \
              experiments/visual-compiler-v7/fresh-holdout/output 2>/dev/null || true
            if [ -f experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json ]; then
              break
            fi
            sleep 5
          done
          test -f experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json
          mkdir -p artifacts/visual-compiler-v7-fresh
          cp experiments/visual-compiler-v7/fresh-holdout/output/v7-routed-claims.json \
            artifacts/visual-compiler-v7-fresh/v7-routed-claims.json
          cp experiments/visual-compiler-v7/fresh-holdout/output/v7-routing-report.md \
            artifacts/visual-compiler-v7-fresh/v7-routing-report.md
          cp experiments/visual-compiler-v7/fresh-holdout/output/v7-routing-summary.json \
            artifacts/visual-compiler-v7-fresh/v7-routing-summary.json

      - name: Fetch the validated v6 render and evaluation harness
        if: steps.completed.outputs.done != 'true'
        run: |
          git fetch origin experiment/visual-compiler-v6-targeted-ab-20260812
          git show origin/experiment/visual-compiler-v6-targeted-ab-20260812:scripts/visual-compiler-v6-render-ab.ts \
            > scripts/visual-compiler-v7-render-ab.ts
          git show origin/experiment/visual-compiler-v6-targeted-ab-20260812:scripts/visual-compiler-v6-evaluate-ab.ts \
            > scripts/visual-compiler-v7-evaluate-ab.ts

      - name: Generate and patch the fallback-safe v7 harness
        if: steps.completed.outputs.done != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          v1 = Path('.github/workflows/visual-compiler-v7-unseen-ab.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = v1.index(marker) + len(marker)
          end = v1.index("\n          PY", start)
          generator = dedent(v1[start:end])
          exec(compile(generator, 'visual-compiler-v7-harness-generator.py', 'exec'))

          path = Path('scripts/visual-compiler-v7-render-ab.ts')
          text = path.read_text()
          old = """            const started = Date.now();
            const { autoClaim, plan } = compileRecord(record);

            if (record.v7Route === 'current_art_director') {"""
          new = """            const started = Date.now();
            const autoClaim = record.renderAutoClaim ?? record.autoClaim;

            if (record.v7Route === 'source_led_fallback') {
              const plan = {
                policyId: 'weekly-visual-compiler-v0',
                claim: autoClaim.claim,
                format: 'cinematic_single',
                renderStrategy: 'one_asset',
                regions: [],
                transitions: [],
                overlays: [],
                renderUnits: [],
                pixelAssertions: [],
                forbiddenContradictions: [],
                execution: {
                  candidateCount: 0,
                  imageCalls: 0,
                  visionCalls: 0,
                  fullRegenerations: 0,
                  estimatedUsd: 0,
                  estimatedDurationMs: 0,
                  withinPolicy: true,
                },
              } as VisualPlan;
              const pixels = await sharp(fallbackSvg())
                .jpeg({ quality: 93, chromaSubsampling: '4:4:4' })
                .toBuffer();
              return {
                pixels,
                final: pixels,
                autoClaim,
                plan,
                audit: {
                  provider: 'local',
                  model: 'source-led-fallback-v7',
                  imageCalls: 0,
                  estimatedImageCostUsd: 0,
                  durationMs: Date.now() - started,
                  assetPaths: [],
                },
              };
            }

            const plan = compileAutoVisualClaimV5(autoClaim);

            if (record.v7Route === 'current_art_director') {"""
          if old not in text:
              raise SystemExit('Expected renderCompiler prelude was not found.')
          text = text.replace(old, new, 1)

          duplicate = """            if (record.v7Route === 'source_led_fallback') {
              const pixels = await sharp(fallbackSvg())
                .jpeg({ quality: 93, chromaSubsampling: '4:4:4' })
                .toBuffer();
              return {
                pixels,
                final: pixels,
                autoClaim,
                plan,
                audit: {
                  provider: 'local',
                  model: 'source-led-fallback-v7',
                  imageCalls: 0,
                  estimatedImageCostUsd: 0,
                  durationMs: Date.now() - started,
                  assetPaths: [],
                },
              };
            }

"""
          if duplicate not in text:
              raise SystemExit('Expected duplicate fallback branch was not found.')
          path.write_text(text.replace(duplicate, '', 1))
          PY

      - name: Install dependencies
        if: steps.completed.outputs.done != 'true'
        run: npm ci

      - name: Typecheck repository and generated A-B harness
        if: steps.completed.outputs.done != 'true'
        run: npm run typecheck

      - name: Render exact current and v7-selected cards
        if: steps.completed.outputs.done != 'true'
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V7_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V7_ROUTED_CLAIMS: artifacts/visual-compiler-v7-fresh/v7-routed-claims.json
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-unseen-ab
        run: npx tsx scripts/visual-compiler-v7-render-ab.ts

      - name: Evaluate seven cards blinded
        if: steps.completed.outputs.done != 'true'
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V7_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V7_ROUTED_CLAIMS: artifacts/visual-compiler-v7-fresh/v7-routed-claims.json
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-unseen-ab
        run: npx tsx scripts/visual-compiler-v7-evaluate-ab.ts

      - name: Build v7 promotion or hold decision
        if: steps.completed.outputs.done != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/visual-compiler-v7-unseen-ab.yml').read_text()
          section = workflow.index('      - name: Build v7 selection and safety decision\n')
          marker = "          cat > /tmp/v7-decision.mjs <<'JS'\n"
          start = workflow.index(marker, section) + len(marker)
          end = workflow.index("\n          JS", start)
          Path('/tmp/v7-decision.mjs').write_text(workflow[start:end])
          PY
          node /tmp/v7-decision.mjs

      - name: Upload complete unseen v7 A-B package
        if: steps.completed.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-unseen-ab-evaluated-v3
          path: |
            artifacts/visual-compiler-v7-fresh
            artifacts/visual-compiler-v7-unseen-ab
          if-no-files-found: error
          retention-days: 14

      - name: Persist unseen v7 A-B results
        if: steps.completed.outputs.done != 'true'
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/results
          cp artifacts/visual-compiler-v7-unseen-ab/render-report.md experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/render-manifest.json experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/blind-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/evaluation-report.md experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/evaluation.json experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/evaluated-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/v7-decision.md experiments/visual-compiler-v7/fresh-holdout/results/
          cp artifacts/visual-compiler-v7-unseen-ab/v7-decision.json experiments/visual-compiler-v7/fresh-holdout/results/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/results/ab-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v7/fresh-holdout/results
          git commit -m "Record reproducible unseen v7 A-B results [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812
