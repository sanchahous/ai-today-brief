name: Visual compiler v5 story ID repair

on:
  push:
    branches:
      - experiment/visual-compiler-v5-fresh-holdout-20260812
    paths:
      - .github/workflows/visual-compiler-v5-repair-story-ids.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Persist semantic normalization then rerun fresh gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v5-fresh-holdout-20260812

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch identity normalization and guarded story ID canonicalization
        run: |
          python - <<'PY'
          from pathlib import Path

          claim_source = Path('src/lib/weekly-digest/visual-auto-claim-v5.ts')
          claim_text = claim_source.read_text()
          old_identity = "  const identity = clean(raw.identity, 180) || story.title.split(/[—:]/)[0]!.trim().slice(0, 180);"
          new_identity = """  const rawIdentity = clean(raw.identity, 180);
          const titleIdentity = clean(story.title, 180);
          const identity =
            rawIdentity.length >= 8
              ? rawIdentity
              : titleIdentity.length >= 8
                ? titleIdentity
                : clean(story.summary, 180);
          if (rawIdentity && rawIdentity.length < 8 && identity !== rawIdentity) {
            warnings.push('identity_expanded_from_story_title');
          }"""
          if old_identity in claim_text:
              claim_text = claim_text.replace(old_identity, new_identity, 1)
          elif 'identity_expanded_from_story_title' not in claim_text:
              raise SystemExit('Identity assignment was not found and the repair marker is absent.')
          claim_source.write_text(claim_text)

          test = Path('src/lib/weekly-digest/visual-auto-claim-v5-short-identity.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import {
            parseAutoVisualClaimV5,
            validateAutoVisualClaimV5,
          } from './visual-auto-claim-v5';
          import type { HoldoutStoryInput } from './visual-auto-claim';

          describe('VisualClaim v5 short identity normalization', () => {
            it('expands a product-only identity from the source title before legacy compilation', () => {
              const story: HoldoutStoryInput = {
                week_start: '2026-06-29',
                week_end: '2026-07-05',
                rank: 3,
                revision_item_id: 'strix-story',
                title: 'Strix: Open-source AI penetration testing tool finds and patches vulnerabilities',
                summary:
                  'Strix is an open-source autonomous AI penetration testing agent that validates vulnerabilities and generates patches.',
                why: 'Dynamic exploit validation reduces false positives.',
                practical: null,
                takeaway: null,
              };

              const value = parseAutoVisualClaimV5(
                {
                  story_id: story.revision_item_id,
                  explanatory_role: 'capability_access',
                  certainty: 'released',
                  mapping_mode: 'literal',
                  identity: 'Strix',
                  change: 'adds autonomous exploit validation and patch generation',
                  visual_driver: 'the testing agent executes an exploit against code and passes a verified flaw to a patch step',
                  visible_outcome: 'a validated vulnerability is followed by a repaired code artifact',
                  core_claim: 'Strix validates exploitable vulnerabilities and generates patches',
                  metric: null,
                  labels: ['STRIX', 'EXPLOIT', 'PATCH'],
                  quantitative_facts: [],
                  states: [],
                  comparison: null,
                  layers: [],
                  routing: null,
                  required_visible_delta: '',
                  forbidden_contradictions: [],
                  grammar: {
                    context_glyph: 'agent',
                    mechanism_glyph: 'code_file',
                    outcome_glyph: 'shield',
                    branch_glyphs: null,
                    relation: 'inspect',
                    outcome_signal: 'safer',
                    human_behavior: false,
                  },
                },
                story,
              );

              expect(value.claim.identity.length).toBeGreaterThanOrEqual(8);
              expect(value.claim.identity).toContain('Strix');
              expect(value.extractionWarnings).toContain('identity_expanded_from_story_title');
              expect(validateAutoVisualClaimV5(value)).toEqual([]);
            });
          });
          """)

          script = Path('scripts/visual-compiler-v5-extract-audit.ts')
          script_text = script.read_text()
          start = script_text.index('function verifyRawClaimSet')
          end = script_text.index('\n\nasync function extractBatch', start)
          replacement = r'''function uuidCharacterDistance(left: string, right: string): number {
            if (left.length !== right.length) return Number.POSITIVE_INFINITY;
            let distance = 0;
            for (let index = 0; index < left.length; index += 1) {
              if (left[index] !== right[index]) distance += 1;
            }
            return distance;
          }

          function verifyRawClaimSet(rawClaims: unknown[], stories: HoldoutStoryInput[]) {
            const expected = new Set(stories.map((story) => story.revision_item_id));
            const received = new Set<string>();
            for (const value of rawClaims) {
              const id = clean(record(value).story_id, 100);
              if (id) received.add(id);
            }
            const missing = [...expected].filter((id) => !received.has(id));
            const unexpected = [...received].filter((id) => !expected.has(id));
            if (rawClaims.length !== stories.length || missing.length || unexpected.length) {
              throw new Error(
                `VisualClaim set mismatch: expected=${stories.length}, received=${rawClaims.length}, missing=${missing.join(',') || 'none'}, unexpected=${unexpected.join(',') || 'none'}.`,
              );
            }
          }

          function canonicalizeRawClaimSet(
            rawClaims: unknown[],
            stories: HoldoutStoryInput[],
          ): unknown[] {
            const expectedIds = stories.map((story) => story.revision_item_id);
            const expected = new Set(expectedIds);
            const exactIds = new Set(
              rawClaims
                .map((value) => clean(record(value).story_id, 100))
                .filter((id) => expected.has(id)),
            );
            const missingIds = expectedIds.filter((id) => !exactIds.has(id));
            const unexpectedRows = rawClaims
              .map((value, index) => ({
                value,
                index,
                id: clean(record(value).story_id, 100),
              }))
              .filter((row) => row.id && !expected.has(row.id));
            const mapping = new Map<number, string>();
            const usedExpectedIds = new Set<string>();

            for (const row of unexpectedRows) {
              const candidates = missingIds.filter(
                (candidate) =>
                  !usedExpectedIds.has(candidate) &&
                  uuidCharacterDistance(row.id, candidate) <= 2,
              );
              if (candidates.length !== 1) continue;
              const candidate = candidates[0]!;
              const competingRows = unexpectedRows.filter(
                (other) =>
                  !mapping.has(other.index) &&
                  uuidCharacterDistance(other.id, candidate) <= 2,
              );
              if (competingRows.length !== 1) continue;
              mapping.set(row.index, candidate);
              usedExpectedIds.add(candidate);
            }

            const normalized = rawClaims.map((value, index) => {
              const canonicalId = mapping.get(index);
              if (!canonicalId) return value;
              const suppliedId = clean(record(value).story_id, 100);
              console.warn(
                `[v5-extract] canonicalized near-match story_id ${suppliedId} -> ${canonicalId}`,
              );
              return { ...record(value), story_id: canonicalId };
            });
            verifyRawClaimSet(normalized, stories);
            return normalized;
          }'''
          script_text = script_text[:start] + replacement + script_text[end:]
          old_return = '  verifyRawClaimSet(rawClaims, stories);\n  return rawClaims;'
          if old_return not in script_text:
              raise SystemExit('extractBatch verification block was not found.')
          script_text = script_text.replace(
              old_return,
              '  return canonicalizeRawClaimSet(rawClaims, stories);',
              1,
          )
          script.write_text(script_text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test repaired compiler contracts
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-auto-claim-v5-short-identity.test.ts
          src/lib/weekly-digest/visual-generic-svg-v5.test.ts

      - name: Typecheck repaired repository
        run: npm run typecheck

      - name: Persist code repair before external extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/weekly-digest/visual-auto-claim-v5.ts \
            src/lib/weekly-digest/visual-auto-claim-v5-short-identity.test.ts \
            scripts/visual-compiler-v5-extract-audit.ts
          git commit -m "Normalize short identities and canonicalize near-match story IDs"
          git push origin HEAD:experiment/visual-compiler-v5-fresh-holdout-20260812

      - name: Extract audit and repair all fresh VisualClaims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_EXTRACT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_OUT_DIR: artifacts/visual-compiler-v5-fresh
        run: npx tsx scripts/visual-compiler-v5-extract-audit.ts

      - name: Persist fresh claims and trigger exact-current A-B
        run: |
          mkdir -p experiments/visual-compiler-v5/fresh-holdout/output
          cp artifacts/visual-compiler-v5-fresh/v5-claims.json experiments/visual-compiler-v5/fresh-holdout/output/
          cp artifacts/visual-compiler-v5-fresh/v5-claim-report.md experiments/visual-compiler-v5/fresh-holdout/output/
          cp artifacts/visual-compiler-v5-fresh/v5-usage.json experiments/visual-compiler-v5/fresh-holdout/output/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v5/fresh-holdout/output/claim-run-id.txt
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('.github/workflows/visual-compiler-v5-fresh-ab.yml')
          lines = [
              line
              for line in path.read_text().splitlines()
              if not line.startswith('# claim-set-run:')
          ]
          lines.extend(['', f"# claim-set-run: {os.environ['GITHUB_RUN_ID']}"])
          path.write_text('\n'.join(lines) + '\n')
          PY
          git add \
            experiments/visual-compiler-v5/fresh-holdout/output \
            .github/workflows/visual-compiler-v5-fresh-ab.yml
          git commit -m "Record repaired fresh v5 claims and trigger A-B [skip ci]"
          git push origin HEAD:experiment/visual-compiler-v5-fresh-holdout-20260812

      - name: Upload repaired claim package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v5-fresh-claims-canonicalized
          path: artifacts/visual-compiler-v5-fresh
          if-no-files-found: error
          retention-days: 14
