name: Visual compiler v7 source-led fallback routing

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-fallback-routing.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  route:
    name: Add fallback route and rebuild unseen routed package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Replace v7 router with explicit safe fallback contract
        run: |
          cat > src/lib/weekly-digest/visual-role-router-v7.ts <<'TS'
          import type { AutoVisualClaimV5 } from './visual-auto-claim-v5';

          export const VISUAL_ROUTES_V7 = [
            'current_art_director',
            'deterministic_compiler',
            'source_led_fallback',
          ] as const;

          export type VisualRouteV7 = (typeof VISUAL_ROUTES_V7)[number];

          export interface VisualRouteDecisionV7 {
            route: VisualRouteV7;
            reason: string;
            sourceClaimEligible: boolean;
            factualVisualAllowed: boolean;
            safeFallback: boolean;
            expectedImageCalls: number;
            estimatedImageCostUsd: number;
          }

          const CURRENT_ART_DIRECTOR_ROLES = new Set([
            'causal_mechanism',
            'state_transition',
            'policy_control',
            'uncertainty_announcement',
          ]);

          const DETERMINISTIC_COMPILER_ROLES = new Set([
            'architecture_transformation',
            'quantitative_result',
            'benchmark_comparison',
            'capability_access',
          ]);

          export function routeVisualClaimV7(input: {
            autoClaim: AutoVisualClaimV5;
            eligible: boolean;
          }): VisualRouteDecisionV7 {
            if (!input.eligible) {
              return {
                route: 'source_led_fallback',
                reason:
                  'The source-audited VisualClaim is ineligible. Publish only a neutral branded visual paired with the approved headline; do not render a factual mechanism, metric, comparison, or explanatory label.',
                sourceClaimEligible: false,
                factualVisualAllowed: false,
                safeFallback: true,
                expectedImageCalls: 0,
                estimatedImageCostUsd: 0,
              };
            }

            const role = input.autoClaim.semantics.explanatoryRole;
            if (CURRENT_ART_DIRECTOR_ROLES.has(role)) {
              return {
                route: 'current_art_director',
                reason: `Role ${role} benefits from a cinematic editorial scene whose physical action carries the meaning.`,
                sourceClaimEligible: true,
                factualVisualAllowed: true,
                safeFallback: false,
                expectedImageCalls: 1,
                estimatedImageCostUsd: 0.015,
              };
            }

            if (DETERMINISTIC_COMPILER_ROLES.has(role)) {
              return {
                route: 'deterministic_compiler',
                reason: `Role ${role} benefits from exact geometry, state, access path, architecture, comparison, or quantitative direction.`,
                sourceClaimEligible: true,
                factualVisualAllowed: true,
                safeFallback: false,
                expectedImageCalls: 0,
                estimatedImageCostUsd: 0,
              };
            }

            return {
              route: 'source_led_fallback',
              reason: `Unsupported explanatory role ${role}; fail closed instead of inventing a visual assertion.`,
              sourceClaimEligible: true,
              factualVisualAllowed: false,
              safeFallback: true,
              expectedImageCalls: 0,
              estimatedImageCostUsd: 0,
            };
          }
          TS

          cat > src/lib/weekly-digest/visual-role-router-v7.test.ts <<'TS'
          import { describe, expect, it } from 'vitest';
          import type { AutoVisualClaimV5 } from './visual-auto-claim-v5';
          import { routeVisualClaimV7 } from './visual-role-router-v7';

          function claim(role: string): AutoVisualClaimV5 {
            return {
              semantics: { explanatoryRole: role },
            } as unknown as AutoVisualClaimV5;
          }

          describe('Visual Compiler v7 role router', () => {
            it.each([
              'causal_mechanism',
              'state_transition',
              'policy_control',
              'uncertainty_announcement',
            ])('routes eligible %s stories to the current art director', (role) => {
              const decision = routeVisualClaimV7({ autoClaim: claim(role), eligible: true });
              expect(decision.route).toBe('current_art_director');
              expect(decision.expectedImageCalls).toBe(1);
              expect(decision.factualVisualAllowed).toBe(true);
            });

            it.each([
              'architecture_transformation',
              'quantitative_result',
              'benchmark_comparison',
              'capability_access',
            ])('routes eligible %s stories to the deterministic compiler', (role) => {
              const decision = routeVisualClaimV7({ autoClaim: claim(role), eligible: true });
              expect(decision.route).toBe('deterministic_compiler');
              expect(decision.expectedImageCalls).toBe(0);
              expect(decision.factualVisualAllowed).toBe(true);
            });

            it('routes an ineligible claim to a zero-cost source-led fallback before role inspection', () => {
              const decision = routeVisualClaimV7({
                autoClaim: claim('causal_mechanism'),
                eligible: false,
              });
              expect(decision.route).toBe('source_led_fallback');
              expect(decision.safeFallback).toBe(true);
              expect(decision.factualVisualAllowed).toBe(false);
              expect(decision.expectedImageCalls).toBe(0);
              expect(decision.estimatedImageCostUsd).toBe(0);
            });

            it('fails closed for an unsupported role', () => {
              const decision = routeVisualClaimV7({ autoClaim: claim('unknown_role'), eligible: true });
              expect(decision.route).toBe('source_led_fallback');
              expect(decision.factualVisualAllowed).toBe(false);
            });
          });
          TS

          cat > scripts/visual-compiler-v7-route-claims.ts <<'TS'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import type { AutoVisualClaimV5 } from '../src/lib/weekly-digest/visual-auto-claim-v5';
          import type { HoldoutStoryInput } from '../src/lib/weekly-digest/visual-auto-claim';
          import {
            routeVisualClaimV7,
            type VisualRouteDecisionV7,
          } from '../src/lib/weekly-digest/visual-role-router-v7';

          const CLAIMS_PATH =
            process.env.VISUAL_V7_CLAIMS?.trim() ||
            'artifacts/visual-compiler-v7-fresh-claims/v5-claims.json';
          const OUT_DIR =
            process.env.VISUAL_V7_OUT_DIR?.trim() || 'artifacts/visual-compiler-v7-fresh';

          interface SourceClaimRecord {
            story: HoldoutStoryInput;
            autoClaim: AutoVisualClaimV5;
            eligible: boolean;
            repaired?: boolean;
            [key: string]: unknown;
          }

          interface RoutedClaimRecord extends SourceClaimRecord {
            v7Route: VisualRouteDecisionV7['route'];
            routeDecision: VisualRouteDecisionV7;
            renderAutoClaim: AutoVisualClaimV5;
          }

          function fallbackClaim(autoClaim: AutoVisualClaimV5): AutoVisualClaimV5 {
            return {
              ...autoClaim,
              claim: {
                ...autoClaim.claim,
                approvedLabels: [],
              },
            };
          }

          function report(rows: RoutedClaimRecord[]): string {
            const distribution = new Map<string, number>();
            for (const row of rows) {
              distribution.set(row.v7Route, (distribution.get(row.v7Route) ?? 0) + 1);
            }
            const expectedImageCalls = rows.reduce(
              (sum, row) => sum + row.routeDecision.expectedImageCalls,
              0,
            );
            const estimatedImageCostUsd = rows.reduce(
              (sum, row) => sum + row.routeDecision.estimatedImageCostUsd,
              0,
            );
            const eligible = rows.filter((row) => row.eligible).length;
            const lines = [
              '# Visual Compiler v7 unseen pre-render routing',
              '',
              `Stories: **${rows.length}**; source-audited eligible claims: **${eligible}/${rows.length}**.`,
              `Expected production image calls: **${expectedImageCalls}**; estimated image cost: **$${estimatedImageCostUsd.toFixed(3)}**.`,
              '',
              '## Route distribution',
              '',
              ...Array.from(distribution.entries()).map(([route, count]) => `- \`${route}\`: ${count}`),
              '',
              '| # | Story | Role | Eligible | Route | Image calls | Factual assertion | Reason |',
              '|---:|---|---|---:|---|---:|---:|---|',
              ...rows
                .sort((left, right) => left.story.rank - right.story.rank)
                .map(
                  (row) =>
                    `| ${row.story.rank} | ${row.story.title.replace(/\|/g, '\\|')} | \`${row.autoClaim.semantics.explanatoryRole}\` | ${row.eligible ? '✓' : '✕'} | \`${row.v7Route}\` | ${row.routeDecision.expectedImageCalls} | ${row.routeDecision.factualVisualAllowed ? 'allowed' : 'blocked'} | ${row.routeDecision.reason.replace(/\|/g, '\\|')} |`,
                ),
              '',
              '## Safety invariant',
              '',
              'An ineligible claim is never sent to a factual image renderer. Its source-led fallback has no explanatory labels, metric, mechanism, comparison, or causal assertion and costs zero image calls.',
              '',
            ];
            return lines.join('\n');
          }

          async function main() {
            const source = JSON.parse(await readFile(CLAIMS_PATH, 'utf8')) as SourceClaimRecord[];
            const rows: RoutedClaimRecord[] = source.map((record) => {
              const routeDecision = routeVisualClaimV7({
                autoClaim: record.autoClaim,
                eligible: Boolean(record.eligible),
              });
              return {
                ...record,
                v7Route: routeDecision.route,
                routeDecision,
                renderAutoClaim:
                  routeDecision.route === 'source_led_fallback'
                    ? fallbackClaim(record.autoClaim)
                    : record.autoClaim,
              };
            });

            const unsafeFallback = rows.find(
              (row) =>
                row.v7Route === 'source_led_fallback' &&
                (row.routeDecision.factualVisualAllowed ||
                  (row.renderAutoClaim.claim.approvedLabels?.length ?? 0) > 0),
            );
            if (unsafeFallback) {
              throw new Error(`Unsafe fallback contract for ${unsafeFallback.story.revision_item_id}.`);
            }
            const misroutedIneligible = rows.find(
              (row) => !row.eligible && row.v7Route !== 'source_led_fallback',
            );
            if (misroutedIneligible) {
              throw new Error(`Ineligible claim escaped fallback: ${misroutedIneligible.story.revision_item_id}.`);
            }

            await mkdir(OUT_DIR, { recursive: true });
            const markdown = report(rows);
            await Promise.all([
              writeFile(join(OUT_DIR, 'v7-routed-claims.json'), `${JSON.stringify(rows, null, 2)}\n`),
              writeFile(join(OUT_DIR, 'v7-routing-report.md'), `${markdown}\n`),
              writeFile(
                join(OUT_DIR, 'v7-routing-summary.json'),
                `${JSON.stringify(
                  {
                    stories: rows.length,
                    eligible: rows.filter((row) => row.eligible).length,
                    routes: Object.fromEntries(
                      ['current_art_director', 'deterministic_compiler', 'source_led_fallback'].map(
                        (route) => [route, rows.filter((row) => row.v7Route === route).length],
                      ),
                    ),
                    expectedImageCalls: rows.reduce(
                      (sum, row) => sum + row.routeDecision.expectedImageCalls,
                      0,
                    ),
                    estimatedImageCostUsd: rows.reduce(
                      (sum, row) => sum + row.routeDecision.estimatedImageCostUsd,
                      0,
                    ),
                  },
                  null,
                  2,
                )}\n`,
              ),
            ]);
            console.log(markdown);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          TS

      - name: Install dependencies
        run: npm ci

      - name: Test fallback routing contract
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-role-router-v7.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Persist router implementation before data processing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/weekly-digest/visual-role-router-v7.ts \
            src/lib/weekly-digest/visual-role-router-v7.test.ts \
            scripts/visual-compiler-v7-route-claims.ts
          if git diff --cached --quiet; then
            echo "Router implementation already persisted."
          else
            git commit -m "Route ineligible visual claims to safe fallback"
            git fetch origin experiment/visual-compiler-v7-role-router-20260812
            git rebase origin/experiment/visual-compiler-v7-role-router-20260812
            SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812
          fi

      - name: Download the completed unseen source-audit package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/audited-v7
          gh run download 31613943481 \
            --repo "$GITHUB_REPOSITORY" \
            --name visual-compiler-v7-fresh-routed-claims-fallback \
            --dir artifacts/audited-v7
          CLAIMS_PATH="$(find artifacts/audited-v7 -name v5-claims.json -print -quit)"
          if [ -z "$CLAIMS_PATH" ]; then
            echo "v5-claims.json was not found in the audit artifact." >&2
            find artifacts/audited-v7 -maxdepth 4 -type f -print >&2
            exit 1
          fi
          mkdir -p artifacts/visual-compiler-v7-fresh-claims
          cp "$CLAIMS_PATH" artifacts/visual-compiler-v7-fresh-claims/v5-claims.json
          REPORT_PATH="$(find artifacts/audited-v7 -name v5-claim-report.md -print -quit)"
          if [ -n "$REPORT_PATH" ]; then
            cp "$REPORT_PATH" artifacts/visual-compiler-v7-fresh-claims/v5-claim-report.md
          fi

      - name: Route all seven unseen claims without image calls
        env:
          VISUAL_V7_CLAIMS: artifacts/visual-compiler-v7-fresh-claims/v5-claims.json
          VISUAL_V7_OUT_DIR: artifacts/visual-compiler-v7-fresh
        run: npx tsx scripts/visual-compiler-v7-route-claims.ts

      - name: Persist unseen routed package
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/output
          cp artifacts/visual-compiler-v7-fresh/v7-routed-claims.json experiments/visual-compiler-v7/fresh-holdout/output/
          cp artifacts/visual-compiler-v7-fresh/v7-routing-report.md experiments/visual-compiler-v7/fresh-holdout/output/
          cp artifacts/visual-compiler-v7-fresh/v7-routing-summary.json experiments/visual-compiler-v7/fresh-holdout/output/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/output/routing-run-id.txt
          git add experiments/visual-compiler-v7/fresh-holdout/output
          git commit -m "Record unseen v7 routed claims [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

      - name: Upload unseen routed package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-fresh-routed-package
          path: |
            artifacts/visual-compiler-v7-fresh-claims
            artifacts/visual-compiler-v7-fresh
          if-no-files-found: error
          retention-days: 14
