name: Visual compiler v9 frozen generalization claim gate

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v9-generalization-claims.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  claims:
    name: Audit and route seven unseen July 27 stories without image calls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all frozen routing contracts
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-role-router-v7.test.ts
          src/lib/weekly-digest/visual-specialized-v8.test.ts
          src/lib/weekly-digest/visual-router-v9.test.ts

      - name: Typecheck repository and routing scripts
        run: npm run typecheck

      - name: Extract and independently audit unseen VisualClaims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_EXTRACT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_HOLDOUT_DATA: experiments/visual-compiler-v9/generalization-2026-07-27/stories.json
          VISUAL_V5_OUT_DIR: artifacts/visual-compiler-v9-generalization-claims
        run: npx tsx scripts/visual-compiler-v5-extract-audit.ts

      - name: Apply frozen v9 router before image calls
        env:
          VISUAL_V9_CLAIMS: artifacts/visual-compiler-v9-generalization-claims/v5-claims.json
          VISUAL_V9_OUT_DIR: artifacts/visual-compiler-v9-generalization
        run: npx tsx scripts/visual-compiler-v9-route-claims.ts

      - name: Assert route integrity and budget
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(
            fs.readFileSync(
              'artifacts/visual-compiler-v9-generalization/v9-routed-claims.json',
              'utf8',
            ),
          );
          if (rows.length !== 7) throw new Error(`Expected 7 rows; received ${rows.length}.`);
          const badIds = rows.filter(
            (row) => row.story.revision_item_id !== row.router.storyId,
          );
          if (badIds.length) throw new Error('Router story IDs do not match source stories.');
          const unsafe = rows.filter(
            (row) =>
              !row.eligible &&
              !row.router.pipeline.startsWith('specialized_') &&
              row.router.pipeline !== 'source_led_fallback',
          );
          if (unsafe.length) {
            throw new Error(
              `Ineligible generic claims escaped safe routing: ${unsafe
                .map((row) => row.story.rank)
                .join(', ')}`,
            );
          }
          const imageCalls = rows.reduce(
            (sum, row) => sum + row.router.expectedImageCalls,
            0,
          );
          if (imageCalls > 7) throw new Error(`Unexpected image-call count: ${imageCalls}.`);
          const counts = rows.reduce((acc, row) => {
            acc[row.router.pipeline] = (acc[row.router.pipeline] || 0) + 1;
            return acc;
          }, {});
          console.log(JSON.stringify({ counts, imageCalls }, null, 2));
          NODE

      - name: Persist frozen claim and routing package
        run: |
          mkdir -p experiments/visual-compiler-v9/generalization-2026-07-27/output
          cp artifacts/visual-compiler-v9-generalization-claims/v5-claims.json experiments/visual-compiler-v9/generalization-2026-07-27/output/
          cp artifacts/visual-compiler-v9-generalization-claims/v5-claim-report.md experiments/visual-compiler-v9/generalization-2026-07-27/output/
          cp artifacts/visual-compiler-v9-generalization-claims/v5-usage.json experiments/visual-compiler-v9/generalization-2026-07-27/output/
          cp artifacts/visual-compiler-v9-generalization/v9-routed-claims.json experiments/visual-compiler-v9/generalization-2026-07-27/output/
          cp artifacts/visual-compiler-v9-generalization/v9-routing-report.md experiments/visual-compiler-v9/generalization-2026-07-27/output/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v9/generalization-2026-07-27/output/claim-routing-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v9/generalization-2026-07-27/output
          git commit -m "Record frozen v9 generalization routing [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

      - name: Upload complete claim-only generalization package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v9-generalization-claims
          path: |
            artifacts/visual-compiler-v9-generalization-claims
            artifacts/visual-compiler-v9-generalization
          if-no-files-found: error
          retention-days: 14
