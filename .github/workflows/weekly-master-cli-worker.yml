name: Weekly generation worker

# Runs one fenced long-lived Weekly generation job. Editorial jobs use the
# Claude Code CLI (subscription-covered), falling back to OpenRouter. Semantic
# story images use the same durable lease because their multi-provider render
# and vision loop can exceed Vercel's 300-second serverless ceiling.
#
# The editorial chain used to be claude-cli only, on the
# reasoning that a missing binary or dead token should fail visibly rather
# than silently spend money — but 2026-08-09 showed what that costs: three
# jobs lost to a CLI-side timeout with nothing behind it. Visibility now comes
# from the preflight step and from a failed job failing the run, so the
# fallback no longer hides anything. A full master through OpenRouter measured
# $0.032 (wiki/ops/weekly-sandbox.md) — cheaper than a lost edition.
#
# On-demand only, dispatched by the admin Server Action or the five-minute
# safety dispatcher, so it never spends Actions minutes on an unattended
# schedule without queued work. Runs against production — see
# src/lib/weekly-digest/github-dispatch.ts for the trigger.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Weekly Digest generation job UUID
        required: true
        type: string
      dispatch_token:
        description: One-time durable dispatch token
        required: true
        type: string
      weekly_digest_id:
        description: Weekly Digest UUID, used for editorial concurrency
        required: true
        type: string
      job_type:
        description: Generation job type (optional during zero-downtime rollout)
        required: false
        default: editorial_master
        type: string

concurrency:
  # Story images are isolated by revision_item_id and must start independently.
  # Editorial jobs keep the original per-digest serialization because they can
  # mint/activate revisions shared by downstream work.
  group: weekly-generation-${{ inputs.job_type == 'story_image' && inputs.job_id || inputs.weekly_digest_id }}
  cancel-in-progress: false

jobs:
  drain:
    name: Weekly generation ${{ inputs.job_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Claude Code CLI
        if: ${{ inputs.job_type != 'story_image' }}
        run: npm install --global @anthropic-ai/claude-code

      - name: Install dependencies
        run: npm ci

      # Diagnostic, never gating: a false positive here must not block a
      # weekly. It runs first so the log opens with "the CLI is not
      # authenticated" / "OpenRouter is out of credit" instead of burying
      # that under forty minutes of generation.
      - name: Provider preflight
        if: ${{ inputs.job_type != 'story_image' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          WEEKLY_MASTER_PROVIDER_ORDER: claude-cli,openrouter
          WEEKLY_CONTENT_STUDIO_V2: production
        run: npm run weekly:doctor

      - name: Run weekly generation worker
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          WEEKLY_MASTER_PROVIDER_ORDER: claude-cli,openrouter
          # No 300-second serverless budget here (the job runs for up to 120
          # minutes), so the master write gets real model fallback instead of
          # dying on one sloppy answer. See premiumOpenRouterModels.
          WEEKLY_MASTER_OPENROUTER_CANDIDATES: "3"
          # Social copy is short structured JSON, not an 8–12 minute editorial
          # master. Keep a slow reasoning model from consuming the entire
          # two-hour worker before a single channel checkpoint can be saved.
          OPENROUTER_FIRST_TOKEN_MS: ${{ inputs.job_type == 'social_copy' && '30000' || '90000' }}
          OPENROUTER_IDLE_MS: ${{ inputs.job_type == 'social_copy' && '20000' || '45000' }}
          OPENROUTER_ABSOLUTE_CEILING_MS: ${{ inputs.job_type == 'social_copy' && '60000' || '720000' }}
          SOCIAL_OPENROUTER_MODEL_ATTEMPTS: ${{ inputs.job_type == 'social_copy' && '2' || '' }}
          # Stop starting new work with 25 minutes of the 120-minute job left,
          # so an over-running edition saves its segments and finishes cleanly
          # instead of being killed mid-write with nothing durable to resume.
          WEEKLY_MASTER_DEADLINE_MS: "5700000"
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEEKLY_CONTENT_STUDIO_V2: production
          WEEKLY_GENERATION_JOB_ID: ${{ inputs.job_id }}
          WEEKLY_GENERATION_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run weekly:master-cli-worker
