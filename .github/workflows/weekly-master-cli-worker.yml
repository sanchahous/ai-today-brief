name: Weekly master CLI worker

# Drains editorial_master jobs via the Claude Code CLI (subscription-covered),
# falling back to the normal OpenRouter/Gemini chain inside the same job when
# claude-cli isn't available. Staging only while Content Studio v2 stays in
# shadow mode — do NOT add SCRAPPER_BASE_URL/SCRAPPER_SERVICE_KEY here, they
# take precedence over the staging vars below and would silently repoint this
# worker at production (see getSupabaseAdmin in src/lib/supabase-admin.ts).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  drain:
    name: Drain editorial_master jobs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run weekly master CLI worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEEKLY_CONTENT_STUDIO_V2: shadow
        run: npm run weekly:master-cli-worker
