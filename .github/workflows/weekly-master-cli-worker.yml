name: Weekly master CLI worker

# Drains editorial_master jobs via the Claude Code CLI (subscription-covered),
# falling back to the normal OpenRouter/Gemini chain inside the same job when
# claude-cli isn't available. Manual/on-demand only, dispatched from the
# admin Weekly Digest Research tab (Server Action -> GitHub API) so it never
# spends Actions minutes on an unattended schedule. Runs against production —
# see src/lib/weekly-digest/github-dispatch.ts for the trigger.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Weekly Digest generation job UUID
        required: true
        type: string
      dispatch_token:
        description: One-time durable dispatch token
        required: true
        type: string
      weekly_digest_id:
        description: Weekly Digest UUID, used only for per-digest concurrency
        required: true
        type: string

concurrency:
  group: weekly-generation-${{ inputs.weekly_digest_id }}
  cancel-in-progress: false

jobs:
  drain:
    name: Weekly generation ${{ inputs.job_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run weekly master CLI worker
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEEKLY_CONTENT_STUDIO_V2: production
          WEEKLY_GENERATION_JOB_ID: ${{ inputs.job_id }}
          WEEKLY_GENERATION_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run weekly:master-cli-worker
