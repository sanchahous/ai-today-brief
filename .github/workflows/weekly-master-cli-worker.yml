name: Weekly master CLI worker

# Drains editorial_master jobs via the Claude Code CLI (subscription-covered).
# This is the explicit Claude path: a missing CLI or invalid subscription token
# fails visibly rather than silently spending the OpenRouter fallback. Manual/on-demand only, dispatched from the
# admin Weekly Digest Research tab (Server Action -> GitHub API) so it never
# spends Actions minutes on an unattended schedule. Runs against production —
# see src/lib/weekly-digest/github-dispatch.ts for the trigger.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Weekly Digest generation job UUID
        required: true
        type: string
      dispatch_token:
        description: One-time durable dispatch token
        required: true
        type: string
      weekly_digest_id:
        description: Weekly Digest UUID, used only for per-digest concurrency
        required: true
        type: string

concurrency:
  group: weekly-generation-${{ inputs.weekly_digest_id }}
  cancel-in-progress: false

jobs:
  drain:
    name: Weekly generation ${{ inputs.job_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Install dependencies
        run: npm ci

      # Diagnostic, never gating: a false positive here must not block a
      # weekly. It runs first so the log opens with "the CLI is not
      # authenticated" / "OpenRouter is out of credit" instead of burying
      # that under forty minutes of generation.
      - name: Provider preflight
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          WEEKLY_MASTER_PROVIDER_ORDER: claude-cli
          WEEKLY_CONTENT_STUDIO_V2: production
        run: npm run weekly:doctor

      - name: Run weekly master CLI worker
        env:
          SCRAPPER_BASE_URL: ${{ secrets.SCRAPPER_BASE_URL }}
          SCRAPPER_SERVICE_KEY: ${{ secrets.SCRAPPER_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: '1'
          WEEKLY_MASTER_PROVIDER_ORDER: claude-cli
          # No 300-second serverless budget here (the job runs for up to 120
          # minutes), so the master write gets real model fallback instead of
          # dying on one sloppy answer. See premiumOpenRouterModels.
          WEEKLY_MASTER_OPENROUTER_CANDIDATES: '3'
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEEKLY_CONTENT_STUDIO_V2: production
          WEEKLY_GENERATION_JOB_ID: ${{ inputs.job_id }}
          WEEKLY_GENERATION_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run weekly:master-cli-worker
