name: Visual compiler prototype

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - src/lib/weekly-digest/visual-compiler.ts
      - src/lib/weekly-digest/visual-compiler.test.ts
      - src/lib/weekly-digest/visual-gate-policy.ts
      - src/lib/weekly-digest/visual-gate-policy.test.ts
      - src/lib/weekly-digest/visual-render-policy.ts
      - src/lib/weekly-digest/visual-render-policy.test.ts
      - scripts/visual-compiler-shadow.ts
      - scripts/visual-compiler-render-shadow-v2.ts
      - scripts/visual-compiler-patch-energy-v3.ts
      - scripts/visual-compiler-evaluate-energy-v3.ts
      - scripts/visual-compiler-patch-qwen-v4.ts
      - scripts/visual-compiler-evaluate-qwen-v4.ts
      - scripts/visual-compiler-contact-sheet.ts
      - scripts/sharp-namespace.d.ts
      - .github/workflows/visual-compiler-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, typecheck and compile shadow plans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused visual compiler tests
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-compiler.test.ts
          src/lib/weekly-digest/visual-gate-policy.test.ts
          src/lib/weekly-digest/visual-render-policy.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Compile seven-story shadow plans
        run: npx tsx scripts/visual-compiler-shadow.ts

      - name: Upload shadow plan package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-shadow
          path: artifacts/visual-compiler-shadow
          if-no-files-found: error
          retention-days: 14
