name: Visual compiler v7.1 unseen A-B

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-1-unseen-ab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ab:
    name: Render evaluate and finalize seven router-selected stories
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate router and complete A-B harness
        run: |
          npx vitest run src/lib/weekly-digest/visual-role-router-v7.test.ts
          npm run typecheck

      - name: Render exact current and v5 compiler candidates for frozen claims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V5_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V5_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output-v7-1/v5-claims.json
          VISUAL_V5_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
        run: npx tsx scripts/visual-compiler-v5-render-ab.ts

      - name: Evaluate exact current and candidate cards blinded
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V5_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output-v7-1/v5-claims.json
          VISUAL_V5_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
        run: npx tsx scripts/visual-compiler-v5-evaluate-ab.ts

      - name: Select the route chosen before rendering and apply fallback safety gates
        env:
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
          VISUAL_V7_ROUTED_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output-v7-1/v7-routed-claims.json
        run: npx tsx scripts/visual-compiler-v7-1-finalize-ab.ts

      - name: Upload full evaluated A-B package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-1-unseen-ab-evaluated
          path: artifacts/visual-compiler-v7-1-ab
          if-no-files-found: error
          retention-days: 14

      - name: Persist decision and review sheets on isolated branch
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/results-v7-1
          cp artifacts/visual-compiler-v7-1-ab/v7-1-decision.md experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/v7-1-selected-evaluation.json experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/v7-1-selected-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/v7-1-owner-blind-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/v7-1-owner-blind-key.json experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/evaluation-report.md experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/evaluation.json experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          cp artifacts/visual-compiler-v7-1-ab/render-report.md experiments/visual-compiler-v7/fresh-holdout/results-v7-1/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/results-v7-1/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v7/fresh-holdout/results-v7-1
          git commit -m "Record unseen router-selected v7.1 A-B results [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812
