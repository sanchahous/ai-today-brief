name: Visual compiler v6 type safety repair

on:
  push:
    branches:
      - experiment/visual-compiler-v6-hybrid-20260812
    paths:
      - .github/workflows/visual-compiler-v6-type-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Apply v6 label and optional-field fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v6-hybrid-20260812

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch normalization and optional claim fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/weekly-digest/visual-hybrid-v6.ts')
          text = path.read_text()
          old = "    .replace(/\\b(billion)\\b/gi, 'B')\n    .replace(/\\s+/g, ' ')"
          new = "    .replace(/\\b(billion)\\b/gi, 'B')\n    .replace(/\\s+([MB])\\b/g, '$1')\n    .replace(/\\s+/g, ' ')"
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              "const base = unique(value.claim.approvedLabels.map((label) => clean(label, 34))).slice(0, 3);",
              "const base = unique((value.claim.approvedLabels ?? []).map((label) => clean(label, 34))).slice(0, 3);",
              1,
          )
          text = text.replace(
              "value.claim.forbiddenContradictions.join('; ') || 'the approved source claim'",
              "(value.claim.forbiddenContradictions ?? []).join('; ') || 'the approved source claim'",
              1,
          )
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run v6 regressions
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-hybrid-v6.test.ts
          src/lib/weekly-digest/visual-generic-svg-v5.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Persist type-safe v6 contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/weekly-digest/visual-hybrid-v6.ts
          git commit -m "Make hybrid v6 claim guards type safe"
          git push origin HEAD:experiment/visual-compiler-v6-hybrid-20260812
