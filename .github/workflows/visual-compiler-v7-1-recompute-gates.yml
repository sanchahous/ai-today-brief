name: Visual compiler v7.1 corrected gates

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-1-recompute-gates.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  gates:
    name: Recompute frozen unseen A-B gates without image calls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck corrected gate implementation
        run: npm run typecheck

      - name: Download frozen v7.1 unseen A-B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31616710069
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-v7-1-unseen-ab-evaluated
          --dir artifacts/visual-compiler-v7-1-ab

      - name: Recompute render-mode-aware gates
        env:
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
          VISUAL_V7_ROUTED_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output-v7-1/v7-routed-claims.json
        run: npx tsx scripts/visual-compiler-v7-1-recompute-gates.ts

      - name: Persist corrected decision
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/results-v7-1-corrected
          cp artifacts/visual-compiler-v7-1-ab/v7-1-corrected-decision.md experiments/visual-compiler-v7/fresh-holdout/results-v7-1-corrected/
          cp artifacts/visual-compiler-v7-1-ab/v7-1-corrected-gates.json experiments/visual-compiler-v7/fresh-holdout/results-v7-1-corrected/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/results-v7-1-corrected/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v7/fresh-holdout/results-v7-1-corrected
          git commit -m "Record render-mode-aware v7.1 gate correction [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

      - name: Upload corrected decision package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-1-corrected-gates
          path: |
            artifacts/visual-compiler-v7-1-ab/v7-1-corrected-decision.md
            artifacts/visual-compiler-v7-1-ab/v7-1-corrected-gates.json
          if-no-files-found: error
          retention-days: 14
