name: Visual compiler shadow v4

on:
  push:
    branches:
      - experiment/visual-routing-backtest-20260812
    paths:
      - .github/workflows/visual-compiler-shadow-v4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    name: Patch Qwen outcomes and finalize headline-paired gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download evaluated v3 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31588402865
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-shadow-v3
          --dir artifacts/visual-compiler-shadow-v2

      - name: Add visible Qwen route outcomes
        env:
          VISUAL_COMPILER_OUT_DIR: artifacts/visual-compiler-shadow-v2
        run: npx tsx scripts/visual-compiler-patch-qwen-v4.ts

      - name: Rebuild v4 review contact sheet
        env:
          VISUAL_COMPILER_OUT_DIR: artifacts/visual-compiler-shadow-v2
        run: npx tsx scripts/visual-compiler-contact-sheet.ts

      - name: Re-evaluate Qwen and finalize all headline-paired gates
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_COMPILER_JUDGE_MODEL: 'google/gemini-2.5-flash'
          VISUAL_COMPILER_OUT_DIR: artifacts/visual-compiler-shadow-v2
        run: npx tsx scripts/visual-compiler-evaluate-qwen-v4.ts

      - name: Upload v4 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-shadow-v4
          path: artifacts/visual-compiler-shadow-v2
          if-no-files-found: error
          retention-days: 14
