name: Visual compiler v7 audit fallback

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-audit-fallback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  claims:
    name: Repair incomplete audit batches and rerun unseen routing gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add strict per-story fallback for omitted audit IDs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/visual-compiler-v5-extract-audit.ts')
          text = path.read_text()
          start = text.index('async function auditClaims(')
          end = text.index('\n\nfunction repairPrompt', start)
          replacement = r'''async function auditClaims(
            rows: Array<{ story: HoldoutStoryInput; raw: unknown; claim: AutoVisualClaimV5 }>,
            usage: UsageTotals,
          ): Promise<ClaimAudit[]> {
            const response = await callModel<{ audits?: unknown }>({
              model: AUDIT_MODEL,
              title: 'AI Today Brief VisualClaim v5 role-aware source audit',
              prompt: auditPrompt(rows),
              maxTokens: 7_000,
              usage,
            });
            const rawAudits = Array.isArray(response.audits) ? response.audits : [];
            const byId = new Map<string, unknown>();
            for (const value of rawAudits) {
              const id = clean(record(value).story_id, 100);
              if (id) byId.set(id, value);
            }

            const missingRows = rows.filter(
              ({ story }) => !byId.has(story.revision_item_id),
            );
            for (const row of missingRows) {
              console.warn(
                `[v5-audit-fallback] auditing omitted story individually: ${row.story.rank} ${row.story.title}`,
              );
              const fallback = await callModel<{ audits?: unknown }>({
                model: AUDIT_MODEL,
                title: 'AI Today Brief VisualClaim v5 single-story source audit fallback',
                prompt: auditPrompt([row]),
                maxTokens: 2_500,
                usage,
              });
              const candidates = Array.isArray(fallback.audits)
                ? fallback.audits
                : [];
              const exact = candidates.find(
                (value) =>
                  clean(record(value).story_id, 100) ===
                  row.story.revision_item_id,
              );
              const value = exact ?? candidates[0];
              if (!value) {
                throw new Error(
                  `Single-story source audit returned no audit for ${row.story.revision_item_id}.`,
                );
              }
              byId.set(row.story.revision_item_id, value);
            }

            const unresolved = rows.filter(
              ({ story }) => !byId.has(story.revision_item_id),
            );
            if (unresolved.length > 0) {
              throw new Error(
                `Source audit still omitted story IDs after fallback: ${unresolved
                  .map(({ story }) => story.revision_item_id)
                  .join(', ')}.`,
              );
            }
            return rows.map(({ story }) =>
              normalizeAudit(
                byId.get(story.revision_item_id),
                story.revision_item_id,
              ),
            );
          }'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate semantic contracts and fallback implementation
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-auto-claim-v5.test.ts
          src/lib/weekly-digest/visual-role-router-v7.test.ts

      - name: Typecheck repository
        run: npm run typecheck

      - name: Persist audited fallback before external calls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-compiler-v5-extract-audit.ts
          git commit -m "Audit omitted VisualClaims individually"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

      - name: Extract and independently audit unseen VisualClaims
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_EXTRACT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V5_HOLDOUT_DATA: experiments/visual-compiler-v7/fresh-holdout/stories.json
          VISUAL_V5_OUT_DIR: artifacts/visual-compiler-v7-fresh-claims
        run: npx tsx scripts/visual-compiler-v5-extract-audit.ts

      - name: Apply role router before image calls
        env:
          VISUAL_V7_CLAIMS: artifacts/visual-compiler-v7-fresh-claims/v5-claims.json
          VISUAL_V7_OUT_DIR: artifacts/visual-compiler-v7-fresh
        run: npx tsx scripts/visual-compiler-v7-route-claims.ts

      - name: Persist source-audited routed package
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/output
          cp artifacts/visual-compiler-v7-fresh-claims/v5-claims.json experiments/visual-compiler-v7/fresh-holdout/output/
          cp artifacts/visual-compiler-v7-fresh-claims/v5-claim-report.md experiments/visual-compiler-v7/fresh-holdout/output/
          cp artifacts/visual-compiler-v7-fresh-claims/v5-usage.json experiments/visual-compiler-v7/fresh-holdout/output/
          cp artifacts/visual-compiler-v7-fresh/v7-routed-claims.json experiments/visual-compiler-v7/fresh-holdout/output/
          cp artifacts/visual-compiler-v7-fresh/v7-routing-report.md experiments/visual-compiler-v7/fresh-holdout/output/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/output/claim-run-id.txt
          git add experiments/visual-compiler-v7/fresh-holdout/output
          git commit -m "Record unseen source-audited v7 routes [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

      - name: Upload complete unseen routing package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-fresh-routed-claims-fallback
          path: |
            artifacts/visual-compiler-v7-fresh-claims
            artifacts/visual-compiler-v7-fresh
          if-no-files-found: warn
          retention-days: 14
