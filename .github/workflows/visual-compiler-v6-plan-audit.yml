name: Visual compiler v6 hybrid treatment gate

on:
  push:
    branches:
      - experiment/visual-compiler-v6-hybrid-20260812
    paths:
      - .github/workflows/visual-compiler-v6-plan-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  treatments:
    name: Plan audit and persist hybrid v6 treatments
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v6-hybrid-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate hybrid contracts before model calls
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-hybrid-v6.test.ts

      - name: Typecheck planner and repository
        run: npm run typecheck

      - name: Plan and independently audit causal analogies
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V6_PLANNER_MODEL: google/gemini-2.5-flash
          VISUAL_V6_AUDIT_MODEL: google/gemini-2.5-flash
          VISUAL_V6_CLAIMS: experiments/visual-compiler-v5/fresh-holdout/output/v5-claims.json
          VISUAL_V6_OUT_DIR: artifacts/visual-compiler-v6-hybrid
        run: npx tsx scripts/visual-compiler-v6-plan-audit.ts

      - name: Persist treatment gate on experiment branch
        run: |
          mkdir -p experiments/visual-compiler-v6/hybrid/output
          cp artifacts/visual-compiler-v6-hybrid/v6-treatments.json experiments/visual-compiler-v6/hybrid/output/
          cp artifacts/visual-compiler-v6-hybrid/v6-treatment-report.md experiments/visual-compiler-v6/hybrid/output/
          cp artifacts/visual-compiler-v6-hybrid/v6-usage.json experiments/visual-compiler-v6/hybrid/output/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v6/hybrid/output/treatment-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v6/hybrid/output
          git commit -m "Record source-audited v6 hybrid treatments [skip ci]"
          git fetch origin experiment/visual-compiler-v6-hybrid-20260812
          git rebase origin/experiment/visual-compiler-v6-hybrid-20260812
          git push origin HEAD:experiment/visual-compiler-v6-hybrid-20260812

      - name: Upload complete treatment package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v6-hybrid-treatments
          path: artifacts/visual-compiler-v6-hybrid
          if-no-files-found: warn
          retention-days: 14
