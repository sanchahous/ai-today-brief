name: Visual compiler v7.2 targeted A-B

on:
  push:
    branches:
      - experiment/visual-compiler-v7-role-router-20260812
    paths:
      - .github/workflows/visual-compiler-v7-2-targeted-ab.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ab:
    name: Patch four treatments evaluate and persist frozen unseen A-B
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/visual-compiler-v7-role-router-20260812
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate treatment routing and deterministic renderers
        run: >-
          npx vitest run
          src/lib/weekly-digest/visual-role-router-v7.test.ts
          src/lib/weekly-digest/visual-treatment-v7-2.test.ts
          src/lib/weekly-digest/visual-specialized-svg-v7-2.test.ts

      - name: Typecheck v7.2 patch and finalizer
        run: npm run typecheck

      - name: Download frozen exact-current A-B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 31616710069
          --repo "$GITHUB_REPOSITORY"
          --name visual-compiler-v7-1-unseen-ab-evaluated
          --dir artifacts/visual-compiler-v7-1-ab

      - name: Expose artifact-relative image and card paths to the patcher
        run: |
          ln -s "$PWD/artifacts/visual-compiler-v7-1-ab/images" images
          ln -s "$PWD/artifacts/visual-compiler-v7-1-ab/cards" cards

      - name: Replace only the four targeted compiler treatments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VISUAL_V7_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
          VISUAL_V7_ROUTED_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output-v7-1/v7-routed-claims.json
        run: npx tsx scripts/visual-compiler-v7-2-patch-ab.ts

      - name: Re-evaluate patched cards against the unchanged current baseline
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          VISUAL_V5_JUDGE_MODEL: google/gemini-2.5-flash
          VISUAL_V5_CLAIMS: experiments/visual-compiler-v7/fresh-holdout/output-v7-1/v5-claims.json
          VISUAL_V5_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
        run: npx tsx scripts/visual-compiler-v5-evaluate-ab.ts

      - name: Apply v7.2 treatment-aware factual and safety gates
        env:
          VISUAL_V7_AB_OUT_DIR: artifacts/visual-compiler-v7-1-ab
        run: npx tsx scripts/visual-compiler-v7-2-finalize-ab.ts

      - name: Upload complete evaluated v7.2 package
        uses: actions/upload-artifact@v4
        with:
          name: visual-compiler-v7-2-targeted-ab-evaluated
          path: artifacts/visual-compiler-v7-1-ab
          if-no-files-found: error
          retention-days: 14

      - name: Persist v7.2 decision and owner review sheets
        run: |
          mkdir -p experiments/visual-compiler-v7/fresh-holdout/results-v7-2
          cp artifacts/visual-compiler-v7-1-ab/v7-2-decision.md experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/v7-2-selected-evaluation.json experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/v7-2-treatment-report.md experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/v7-2-treatments.json experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/v7-2-selected-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/v7-2-owner-blind-contact-sheet.png experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/v7-2-owner-blind-key.json experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          cp artifacts/visual-compiler-v7-1-ab/evaluation-report.md experiments/visual-compiler-v7/fresh-holdout/results-v7-2/
          printf '%s\n' "$GITHUB_RUN_ID" > experiments/visual-compiler-v7/fresh-holdout/results-v7-2/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/visual-compiler-v7/fresh-holdout/results-v7-2
          git commit -m "Record targeted v7.2 frozen unseen A-B results [skip ci]"
          git fetch origin experiment/visual-compiler-v7-role-router-20260812
          git rebase origin/experiment/visual-compiler-v7-role-router-20260812
          SKIP_E2E=1 git push origin HEAD:experiment/visual-compiler-v7-role-router-20260812

# rerun-after-artifact-path-fix
