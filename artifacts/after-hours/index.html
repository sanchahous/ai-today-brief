<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>AI Today Brief — After Hours design prototype</title>
    <meta name="description" content="After Hours v3: the design-system prototype for the AI Today Brief redesign." />
    <meta name="theme-color" content="#171918" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efe8da" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Apply theme and language before first paint: no flash of the wrong theme. */
      (() => {
        try {
          const q = new URLSearchParams(location.search);
          const saved = JSON.parse(localStorage.getItem("atb-after-hours-prefs") || "{}");
          const theme = ["night", "day"].includes(q.get("theme")) ? q.get("theme") : saved.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night");
          document.documentElement.dataset.theme = theme;
          const lang = ["en", "uk"].includes(q.get("lang")) ? q.get("lang") : saved.lang;
          if (lang) document.documentElement.lang = lang;
        } catch {
          /* Storage blocked: CSS defaults (Night) apply. */
        }
      })();
    </script>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="tension.css" />
    <script defer src="tension.js"></script>
    <script defer src="app.js"></script>
    <script defer src="data.js"></script>
    <script defer src="home.js"></script>
    <script defer src="articles.js"></script>
    <script defer src="editions.js"></script>
    <script defer src="knowledge.js"></script>
    <script defer src="toolbox.js"></script>
    <script defer src="pages.js"></script>
    <script defer src="seo.js"></script>
    <script defer src="boot.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app">
      <noscript>
        <p class="noscript">This design prototype renders with JavaScript. Production pages are server-rendered and readable without it. See <a href="gallery-v3.html">the v3 screenshot gallery</a>.</p>
      </noscript>
    </div>
    <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
      <div class="search-head">
        <p class="eyebrow" id="search-title">Search the publication</p>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close search">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="search-input-wrap">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
        <label for="global-search" class="sr-only">Search</label>
        <input id="global-search" type="search" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-describedby="search-hint" />
        <kbd>Esc</kbd>
      </div>
      <p id="search-hint" class="sr-only">Results update as you type. Use the arrow keys to move through them.</p>
      <div id="search-results" aria-live="polite"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite" data-visible="false"></div>
  </body>
</html>
