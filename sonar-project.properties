# SonarCloud: keys must match the project in https://sonarcloud.io (Project Information).
sonar.organization=sanchahous
sonar.projectKey=sanchahous_ai-today-brief
sonar.projectName=ai-today-brief
sonar.sourceEncoding=UTF-8

# New Code = diff vs main (Sonar way gate on free plan).
sonar.newCode.referenceBranch=main

# Report gate on dashboard but do not fail GitHub Actions (fix issues incrementally).
sonar.qualitygate.wait=false

sonar.sources=src

sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.vitest.test.ts,**/*.vitest.test.tsx

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/.claude/**,**/.cursor/**,**/.agents/**,docs/**,**/*.d.ts

# Coverage gate scope = Vitest logic-only (vitest.config.ts coverage include/exclude).
# App routes, components, and Supabase IO modules are out of scope for the 70% local gate.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.vitest.test.ts,**/*.vitest.test.tsx,**/__fixtures__/**,src/**/*.tsx,src/app/**,src/components/**,src/lib/database.types.ts,src/lib/i18n.ts,src/lib/legal.ts,src/lib/marketing-content.ts,src/lib/home-content.ts,src/lib/supabase.ts,src/lib/home.ts,src/lib/news.ts,src/lib/items.ts,src/lib/concepts.ts,src/lib/categories.ts,pipeline/run-daily.ts,pipeline/summarize.ts,pipeline/publish.ts,pipeline/log.ts,pipeline/sources/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
